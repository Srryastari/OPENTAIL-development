name: Extract OpenTail active baselines
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    if: github.ref_name == 'setup/active-development-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned source packages
        run: python3 scripts/extract_active_baselines.py
      - name: Commit extracted working source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware studio android hardware
          if ! git diff --cached --quiet; then
            git commit -m "baseline: extract CORE Studio Android and hardware sources"
            git push origin HEAD:setup/active-development-baseline
          fi
