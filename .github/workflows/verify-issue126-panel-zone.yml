name: Issue126 Panel/Zone exact-head CORE verification
on:
  push:
    branches:
      - firmware/issue126-panel-zone-core-20261108
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - triggers/issue121-turn-release-debounce-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact tested HEAD and sequential parent
        env:
          PIN: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PIN"
          git merge-base --is-ancestor 66c2d9c843a0b434f9399811110e42d7e26c4692 HEAD
      - name: Verify firmware-only scope and exact Panel/Zone source contract
        run: |
          cd core-firmware
          python3 tests/test_panel_zone_runtime_contract.py
          cd ..
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(
              ["git","diff","--name-only",
               "66c2d9c843a0b434f9399811110e42d7e26c4692","HEAD"],
              text=True).splitlines()
          # Approved split-source renderer integration only. Keep all other
          # Android/UI paths forbidden and prove byte identity to the vetted
          # Effects #110 + Android #111 Git blobs, not just file names.
          approved={
              "android/app/src/main/cpp/core/effects_1d.c":
                  "3985028279ec7ef6d765415b6e54f4fa027647d0",
              "android/app/src/main/cpp/core/effects_1d.h":
                  "a1e9c4b7601704f725c4c9221f606bc11a213bf7",
              "android/app/src/main/cpp/core/wled_fx_compat.c":
                  "85f0cc22bdcff6cdb43a408d6b338fbfd2454671",
              "android/app/src/main/cpp/core/SOURCE.json":
                  "7eeca0e24a0801cb3bad0d77f5f64873824a215d",
              "android/qa/test_full_offline_preview.py":
                  "8bc501e86a06ddaf84f9acd149118e8da3c1a78f",
          }
          forbidden=[p for p in paths if p.startswith(("android/","web-studio/","studio/"))
                     and p not in approved]
          assert not forbidden, forbidden
          for path,expected in approved.items():
              actual=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          print("PASS: approved JNI/manifest blobs only; no other Android or UI source changes")
          PY
      - name: Full CORE host regressions — Panel, Trigger, Effects, BLE, STOP and NVS
        run: cd core-firmware && bash tests/run-host-tests.sh
  esp-idf-5-5-5:
    needs: exact-head-and-host
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert immutable exact HEAD
        env:
          PIN: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PIN"
      - name: Compile CORE for ESP32-S3 with ESP-IDF v5.5.5 — NO FLASH
        uses: espressif/esp-idf-ci-action@v1
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: core-firmware
          command: idf.py build && python3 tests/check_input_edge_isr_iram.py build/opentail_core_alpha.elf
      - name: Verify application and flash manifest
        env:
          PIN: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -s core-firmware/build/opentail_core_alpha.bin
          test -s core-firmware/build/opentail_core_alpha.elf
          test -s core-firmware/build/opentail_core_alpha.map
          test -s core-firmware/build/bootloader/bootloader.bin
          test -s core-firmware/build/partition_table/partition-table.bin
          test -s core-firmware/build/flasher_args.json
          test -s core-firmware/build/ota_data_initial.bin
          test -s core-firmware/build/isr-evidence/input_edge_isr.symbols.txt
          test -s core-firmware/build/isr-evidence/input_edge_isr.dis
          test -s core-firmware/build/isr-evidence/input_edge_isr.audit.txt
          # The ESP-IDF container emits root-owned build artifacts; restore
          # runner ownership before writing the exact-head evidence manifest.
          sudo chown -R "$(id -u):$(id -g)" core-firmware/build
          python3 - <<'PY'
          import json
          from pathlib import Path
          import hashlib, json, os
          build=Path("core-firmware/build")
          refs=json.loads((build/"flasher_args.json").read_text())["flash_files"]
          assert len(refs)>=3
          required=set(refs.values()) | {
              "opentail_core_alpha.elf","opentail_core_alpha.map",
              "isr-evidence/input_edge_isr.symbols.txt",
              "isr-evidence/input_edge_isr.dis",
              "isr-evidence/input_edge_isr.audit.txt",
          }
          assert all((build/name).is_file() and (build/name).stat().st_size>0 for name in required)
          evidence={
              "commit":os.environ["PIN"],
              "target":"esp32s3",
              "esp_idf_version":"v5.5.5",
              "files":{name:hashlib.sha256((build/name).read_bytes()).hexdigest()
                       for name in sorted(required)},
          }
          (build/"CORE_BUILD_EVIDENCE.json").write_text(json.dumps(evidence,indent=2)+"\n")
          print("PASS: exact-head ESP32-S3 image, complete flash manifest, linker map and retained ISR disassembly; no device flashed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: opentail-issue126-bench-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            core-firmware/build/opentail_core_alpha.bin
            core-firmware/build/opentail_core_alpha.elf
            core-firmware/build/opentail_core_alpha.map
            core-firmware/build/bootloader/bootloader.bin
            core-firmware/build/partition_table/partition-table.bin
            core-firmware/build/ota_data_initial.bin
            core-firmware/build/flasher_args.json
            core-firmware/build/CORE_BUILD_EVIDENCE.json
            core-firmware/build/isr-evidence/
          if-no-files-found: error
          retention-days: 14
# Passing this workflow does not certify 2,048-pixel RMT timing, brightness/current,
# thermal behavior, vehicle optics, STOP hardware, or road safety.
