name: Verify OpenTail active sources
on:
  push:
    branches: [work/extract-active-sources]
  pull_request:
    paths:
      - 'core-firmware/**'
      - 'android/**'
      - 'web-studio/**'
      - '.github/workflows/verify-active-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-firmware
    steps:
      - uses: actions/checkout@v4
      - name: Run native firmware logic tests
        run: bash tests/run-host-tests.sh

  core-espidf-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile ESP32-S3 firmware with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: core-firmware

  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate Android WebView JavaScript syntax and output integration contract
        run: |
          node --check android/app/src/main/assets/ble-output-panel.js
          node --check android/app/src/main/assets/output-control-motion.js
          node --check android/app/src/main/assets/direct-ble-dashboard.js
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const ble=fs.readFileSync('android/app/src/main/assets/ble-output-panel.js','utf8');
          const ui=fs.readFileSync('android/app/src/main/assets/output-control-motion.js','utf8');
          assert(ble.includes("getSelectedIndex(){return selected;}"),'BLE selected index API missing');
          assert(ble.includes("announceSelection();load(selected);"),'Selection event must precede reload');
          assert(ui.includes("opentail:ble-output-selected"),'Output Control selection listener missing');
          assert(ui.includes("selectedFromManager()"),'Independent mode must follow BLE manager');
          assert(ui.includes("let mode='independent',target='one';"),'Independent mode must be the default');
          assert(ui.includes("if(mode==='independent'&&e.target.value==='both')"),'Independent mode must reject both targets');
          console.log('Android WebView integration contract checks passed (static checks only).');
          JS
      - name: Compile debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Read Android version from Gradle
        id: apk-version
        shell: bash
        run: |
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\\1/p" android/app/build.gradle | head -n 1)
          test -n "$version" || { echo 'Missing Android versionName'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Name debug APK using its actual version
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/opentail-android-v${{ steps.apk-version.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: opentail-android-v${{ steps.apk-version.outputs.version }}-debug-apk
          path: android/app/build/outputs/apk/debug/opentail-android-v${{ steps.apk-version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 14

  web-studio-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment and versioned Studio copies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('web-studio/opentail.htm').read_bytes()
          b=Path('web-studio/opentail-v0.19.50.htm').read_bytes()
          assert a == b, 'Stable and versioned Studio copies differ'
          bundled=Path('android/app/src/main/assets/opentail.htm').read_bytes()
          assert a == bundled, 'Android APK bundles a stale Studio file'
          assert b'OpenTail Studio v0.19.50' in a, 'Unexpected Studio version'
          print('All Studio copies match (web deployment, versioned, Android bundle).')
          PY
      - name: Parse Studio JavaScript and verify trigger example mapping
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('web-studio/opentail.htm').read_text()
          scripts=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',html)
          assert len(scripts)>=1, 'No Studio scripts found'
          for i,src in enumerate(scripts):
              Path(f'/tmp/opentail-script-{i}.js').write_text(src)
          print('Extracted',len(scripts),'Studio scripts')
          PY
          for file in /tmp/opentail-script-*.js; do node --check "$file"; done
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const html=fs.readFileSync('web-studio/opentail.htm','utf8');
          const a=html.indexOf('function otSimTriggerExampleMode()');
          const b=html.indexOf('function otSimEffectForZone(z)',a);
          const c=html.indexOf('function otSimElapsed()',b);
          assert(a>0&&b>a&&c>b,'Preview helper/resolver missing');
          const js=html.slice(a,c);
          function build(profiles,selected=['Brake']){
            const otSim={triggers:selected,source:'trigger'};
            const state={profiles,wledEdit:{}};
            const zone={id:'zoneA',name:'Custom 1'};
            const resolved=new Function('otSim','state','otPreviewConfiguredZones','otUE','otSimDraft','DEFAULT_PROFILE',js+';return {example:otSimTriggerExampleMode,effect:otSimEffectForZone};');
            const fx=resolved(otSim,state,()=>[zone],null,x=>({fx:x.pattern||'solid',fg:x.color||'#ff0000',brightness:x.brightness/100,speed:.5,intensity:.5}),()=>({zones:[],brightness:85,color:'#ff0000',pattern:'solid'}));
            return {example:fx.example(),effect:fx.effect(zone)};
          }
          const blank=build({Brake:{zones:[],brightness:85,color:'#ff0000',pattern:'solid'}});
          assert.equal(blank.example,true,'Unassigned preview must use example mode');
          assert.equal(blank.effect.fg,'#ff0000');
          assert(blank.effect.brightness>0,'Trigger example must illuminate pixels');
          assert.equal(blank.effect.triggerName,'Brake');
          const mapped=build({Brake:{zones:['zoneA'],brightness:85,color:'#ff0000',pattern:'solid'}});
          assert.equal(mapped.example,false,'Assigned preview must use actual assignments');
          assert(mapped.effect.brightness>0);
          const empty=build({Brake:{zones:[],brightness:85,color:'#ff0000'}},[]);
          assert.equal(empty.example,false,'No pressed triggers is not an example');
          console.log('Offline trigger preview tests passed.');
          JS
