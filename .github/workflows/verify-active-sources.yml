name: Verify OpenTail active sources
on:
  push:
    branches: [main, work/extract-active-sources, 'integration/**', 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-active-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  change-impact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare all changed files to last verified successful CI baseline
        env:
          OPENTAIL_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_regressions.py --mode audit
      - name: Verify OTA layout and local-update contract without asserting hardware success
        run: python3 core-firmware/tests/test_ota_contract.py
      - name: Test that missing hardware proof, stale commits and unclassified changes are rejected
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  core-host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-firmware
    steps:
      - uses: actions/checkout@v4
      - name: Enforce locked release contract and evidence separation
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          contract=Path('docs/OPENTAIL-LOCKED-RELEASE-CONTRACT.md').read_text()
          matrix=Path('docs/verified-bench-regression-matrix.md').read_text()
          required=['Universal', 'v0.1.25', 'v0.1.26', 'WLED-native', 'bench-only', 'flasher_args.json', 'status LED']
          for term in required:
              assert term.lower() in contract.lower(), f'Locked release contract missing: {term}'
          assert 'Not repeated' in matrix or 'Not yet' in matrix, 'Physical verification must be distinguished from software checks'
          print('Locked CORE contract and physical-evidence separation verified')
          PY
      - name: Run native firmware logic tests
        run: bash tests/run-host-tests.sh

  core-espidf-build:
    # CORE build depends only on CORE regression checks, not on an Android
    # release or Studio UI. All three products keep independent CI jobs.
    needs: [core-host-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Assert firmware embeds only the CORE dev console
        run: python3 core-firmware/tests/test_dev_console_contract.py
      - name: Compile ESP32-S3 firmware with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: core-firmware
      - name: Verify ESP32-S3 flash images and metadata
        shell: bash
        run: |
          set -euo pipefail
          build=core-firmware/build
          test -s "$build/opentail_core_alpha.bin"
          test -s "$build/bootloader/bootloader.bin"
          test -s "$build/partition_table/partition-table.bin"
          test -s "$build/flasher_args.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          build=Path('core-firmware/build')
          meta=json.loads((build/'flasher_args.json').read_text())
          files=meta.get('flash_files',{})
          assert isinstance(files,dict) and len(files)>=3, 'Flasher manifest needs bootloader, partitions and app'
          for name in files.values():
              p=build/name
              assert p.is_file() and p.stat().st_size>0, f'Missing referenced flash image: {p}'
          print('Validated flash images and flasher offsets:',list(files))
          PY
      - name: Create versioned CORE app binary
        shell: bash
        run: |
          mkdir -p core-firmware/releases
          cp core-firmware/build/opentail_core_alpha.bin core-firmware/releases/opentail-core-v0.1.30-alpha-app.bin
      - name: Upload flashable CORE bench firmware package
        uses: actions/upload-artifact@v4
        with:
          name: opentail-core-v0.1.30-alpha-esp32s3-bench-firmware
          path: |
            core-firmware/build/opentail_core_alpha.bin
            core-firmware/releases/opentail-core-v0.1.30-alpha-app.bin
            core-firmware/build/bootloader/bootloader.bin
            core-firmware/build/partition_table/partition-table.bin
            core-firmware/build/flasher_args.json
            core-firmware/build/flash_args
            core-firmware/build/ota_data_initial.bin
            core-firmware/build/project_description.json
          if-no-files-found: error
          retention-days: 14

  github-flash-package-check:
    # Validate the actual downloaded GitHub artifact on Windows, not just the
    # files left in the Linux build workspace. Do not access a serial port.
    needs: [core-espidf-build]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub-to-device installer with released artifact (no flash)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./scripts/flash-from-github.ps1 -RunId ${{ github.run_id }} -Version '0.1.30-alpha' -VerifyOnly

  release-evidence-gate:
    # Intentionally BLOCKS release until actual physical evidence is supplied
    # for the exact commit. A green host build is NOT hardware approval.
    if: always()
    needs:
      - change-impact-audit
      - core-host-tests
      - core-espidf-build
      - github-flash-package-check
      - web-studio-check
      - android-debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require every software job to have succeeded on this candidate
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          results=json.loads(os.environ['JOB_RESULTS'])
          problems=[f'{name}: {value["result"]}' for name,value in results.items()
                    if value['result']!='success']
          assert not problems,'CI software jobs failed or skipped: '+', '.join(problems)
          print('All required firmware/UI/Android/installer jobs passed in this run.')
          PY
      - name: Require current physical test evidence and full effect provenance
        env:
          OPENTAIL_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_regressions.py --mode release

  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate Android WebView JavaScript syntax and output integration contract
        run: |
          node --check android/qa/test_unified_ble_fx.cjs
          node android/qa/test_unified_ble_fx.cjs
          node --check android/app/src/main/assets/ble-output-panel.js
          node --check android/app/src/main/assets/output-control-motion.js
          node --check android/app/src/main/assets/direct-ble-dashboard.js
          node android/qa/test_ble_output_pending.cjs
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const ble=fs.readFileSync('android/app/src/main/assets/ble-output-panel.js','utf8');
          const ui=fs.readFileSync('android/app/src/main/assets/output-control-motion.js','utf8');
          assert(ble.includes("getSelectedIndex(){return selected;}"),'BLE selected index API missing');
          assert(ble.includes("announceSelection();load(selected);"),'Selection event must precede reload');
          assert(!ui.includes("manager.before(card)") && !ui.includes("let mode='independent',target='one';"),
            'Unimplemented Output Control development card must not be injected');
          assert(ble.includes('main.append(node)'), 'Functional BLE manager must follow the approved Layout editor');
          console.log('Android WebView integration contract checks passed (static checks only).');
          JS
      - name: Run full Android release contract audit
        run: python3 android/qa/check_release.py
      - name: Compile debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Read Android version from Gradle
        id: apk-version
        shell: bash
        run: |
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\\1/p" android/app/build.gradle | head -n 1)
          test -n "$version" || { echo 'Missing Android versionName'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Name debug APK using its actual version
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/opentail-android-v${{ steps.apk-version.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: opentail-android-v${{ steps.apk-version.outputs.version }}-debug-apk
          path: android/app/build/outputs/apk/debug/opentail-android-v${{ steps.apk-version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 14

  web-studio-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run standalone Studio UI and interaction regressions
        run: node --test web-studio/tests/*.test.cjs
      - name: Check deployment and versioned Studio copies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('web-studio/opentail.htm').read_bytes()
          b=Path('web-studio/opentail-v0.19.118.htm').read_bytes()
          assert a == b, 'Stable and versioned Studio copies differ'
          bundled=Path('android/app/src/main/assets/opentail.htm').read_bytes()
          assert a == bundled, 'Android APK bundles a stale Studio file'
          assert b'OpenTail Studio v0.19.118' in a, 'Unexpected Studio version'
          print('All Studio copies match (web deployment, versioned, Android bundle).')
          PY
      - name: Validate Studio JavaScript and offline pixel preview
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('web-studio/opentail.htm').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.S)
          assert len(scripts)>=1, 'No Studio scripts found'
          for i,src in enumerate(scripts):
              Path(f'/tmp/opentail-script-{i}.js').write_text(src)
          print('Extracted',len(scripts),'Studio scripts')
          PY
          for file in /tmp/opentail-script-*.js; do node --check "$file"; done
          node --check web-studio/tests/offline-trigger-preview.test.cjs
          node web-studio/tests/offline-trigger-preview.test.cjs
          node --check web-studio/tests/layout-history.test.cjs
          node web-studio/tests/layout-history.test.cjs
          node --check web-studio/tests/offline-trigger-panel.test.cjs
          node web-studio/tests/offline-trigger-panel.test.cjs
          node --check web-studio/tests/pixel-direction-and-ui.test.cjs
          node web-studio/tests/pixel-direction-and-ui.test.cjs
          node --check web-studio/tests/exact-live-indexed.test.cjs
          node web-studio/tests/exact-live-indexed.test.cjs
          node --check web-studio/tests/approved-chat-ui.test.cjs
          node web-studio/tests/approved-chat-ui.test.cjs
          node --check android/app/src/main/assets/unified-shell.js
          node android/qa/test_unified_shell.js
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const shell=fs.readFileSync('android/app/src/main/assets/unified-shell.js','utf8');
          const studio=fs.readFileSync('web-studio/opentail.htm','utf8');
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          assert(shell.includes("const showing=route==='home';"),'Android shell still hides approved Layout or Triggers behind a summary');
          assert(studio.includes('builder:()=>builder()+')&&studio.includes('layout:()=>layout()+'),
            'CORE full editors must appear before advanced hardware panels');
          assert(studio.includes('CORE physical trigger input mapping · Advanced'));
          assert(studio.includes('CORE hardware output mapping · Advanced'));
          const scene=studio.slice(studio.indexOf('function scenes(){'),studio.indexOf('let otPresetEditorId=null;'));
          assert(scene.indexOf('ot-subnav')>=0 && scene.indexOf('ot-subnav')<scene.indexOf('otPixelPreview()') &&
            scene.indexOf('otPixelPreview()')<scene.indexOf("otSub==='Effects'"),
            'Approved Show Modes order: Effects/Sequences/Presets then preview then inline editor');
          assert(!scene.includes('otNativeShowPanel()') && scene.includes('otBleFxMode()'),
            'One Show Modes editor must own CORE Bluetooth effects; no second native picker');
          assert(shell.includes('Android v0.1.29')&&gradle.includes("versionName '0.1.29'"),
            'Android app and shell version must match');
          console.log('Android editor routing and version assertions passed (static).');
          JS
