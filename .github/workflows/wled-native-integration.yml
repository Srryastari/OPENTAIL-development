name: OpenTail unified WLED integration

on:
  pull_request:
    branches: ["main", "feature/wled-1d-fade-wipe-sweep"]
    paths:
      - "wled-native/**"
      - "core-firmware/main/**"
      - ".github/workflows/wled-native-integration.yml"
  push:
    branches: ["integration/core-v0.1.25-unified-effects-status"]
    paths:
      - "wled-native/**"
      - "core-firmware/main/**"
      - ".github/workflows/wled-native-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentail-wled-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-bridge-and-overlay-tests:
    name: Bridge metadata, overlay and unified-renderer host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pinned-source compositor patch (idempotent and fail-closed)
        run: python wled-native/patch_wled_render_hook.py --self-test
      - name: Run native bridge tests
        run: node --test wled-native/tests/native-bridge.test.mjs
      - name: Compile and run C++ host tests
        shell: bash
        run: |
          set -euo pipefail
          for source in test_native_overlay test_native_effects test_render_coordinator; do
            binary="$(mktemp)"
            trap 'rm -f "$binary"' EXIT
            c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
              "wled-native/tests/${source}.cpp" -o "$binary"
            "$binary"
            rm -f "$binary"
            trap - EXIT
          done

  native-wled-firmware-build:
    name: Compile pinned WLED with OpenTail post-render hook (no flashing)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Patch and build pinned native WLED image
        run: |
          set -euo pipefail
          bash wled-native/build-native.sh "$RUNNER_TEMP/opentail-wled-build"
      - name: Verify firmware artifact and actual compositor hook
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/opentail-wled-build/.pio/build/opentail_s3_n16r8/firmware.bin"
          grep -q 'opentailNativePostRender(_pixels, totalLen);' "$RUNNER_TEMP/opentail-wled-build/wled00/FX_fcn.cpp"
      - name: Upload unflashed native WLED build
        uses: actions/upload-artifact@v4
        with:
          name: opentail-wled-native-esp32s3-unflashed
          path: ${{ runner.temp }}/opentail-wled-build/.pio/build/opentail_s3_n16r8/firmware.bin
          if-no-files-found: error
          retention-days: 7
