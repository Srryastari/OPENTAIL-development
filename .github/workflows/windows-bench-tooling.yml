name: OpenTail Windows bench tooling
on:
  push:
    branches: [main]
    paths:
      - 'OpenTail-Bench.bat'
      - 'scripts/windows/**'
      - '.github/workflows/windows-bench-tooling.yml'
  workflow_dispatch:
jobs:
  windows-bench-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse all Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          $files=@('scripts/windows/OpenTail-Bench.ps1','scripts/windows/Serial-Capture.ps1','scripts/windows/Bench-Diagnostics.ps1')
          foreach($file in $files) {
            $tokens=$null
            $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "$file at $($_.Extent.StartLineNumber): $($_.Message)" }
              throw "$file PowerShell parse failed"
            }
            Write-Host "PASS parse $file"
          }
      - name: Offline no-hardware runner self-test
        shell: powershell
        run: |
          & .\scripts\windows\OpenTail-Bench.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw "Offline bench self-test failed"}
          $latest=Get-ChildItem .\bench-reports -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if($null -eq $latest){throw "No bench report directory"}
          $json=Get-Content (Join-Path $latest.FullName 'report.json') -Raw | ConvertFrom-Json
          if($json.checks.'Runner self-test'.state -ne 'PASS'){throw "Report did not record PASS"}
          if($json.checks.'Independent RMT test'.state -ne 'UNAVAILABLE'){throw "False physical RMT claim"}
          if($json.checks.'BLE runtime'.state -ne 'NOT RUN' -or $json.checks.'Pixel Probe'.state -ne 'NOT RUN') {
            throw "Hardware checks were falsely evaluated before a capture session"
          }
          if($json.checks.'ADB device parser self-test'.state -ne 'PASS') {
            throw "USB Android phone discovery regression failed"
          }
          if($json.checks.'ESP COM selector self-test'.state -ne 'PASS') {
            throw "USB ESP32 COM single/multiple/missing-port regression failed"
          }
          if($json.checks.'Stage classifier self-test'.state -ne 'PASS'){throw "Read-only stage/identity/clock regressions failed"}
          $results=Get-Content (Join-Path $latest.FullName 'RESULTS.json') -Raw | ConvertFrom-Json
          if($results.mode -ne 'bluetooth' -or $results.capture_requested_seconds -ne 30 -or $results.status -ne 'PASS'){
            throw "FAST defaults or structured machine-readable report failed"
          }
          if($results.stages.owner_enrollment.status -ne 'NOT RUN'){throw "Offline test fabricated owner enrollment"}
          Write-Host "PASS offline report, 30s FAST defaults, classifications and physically honest RMT status"
      - name: Safety contract audit
        shell: powershell
        run: |
          $runner=Get-Content 'scripts/windows/OpenTail-Bench.ps1' -Raw
          $serial=Get-Content 'scripts/windows/Serial-Capture.ps1' -Raw
          $bat=Get-Content 'OpenTail-Bench.bat' -Raw
          foreach($required in @('Confirm*Flash','0x20000','FLASH $port','release_manifest.json','SHA256SUMS.txt','adb','$script:ghExe run download','Pixel Probe','STOP')) {
            if($required -eq 'Confirm*Flash'){continue}
            if(-not $runner.Contains($required)){throw "Missing safety/feature marker: $required"}
          }
          if($runner.Contains('erase_flash') -or $runner.Contains('erase-flash')) {
            throw "Destructive flash invocation forbidden"
          }
          if($runner.Contains('factory_reset.py') -and -not $runner.Contains('Remove-Item -Force')) {
            throw "The reset utility may only appear in the local artifact sanitization path"
          }
          if($runner -match '(?im)^\s*(?:\&|Start-Process|python|py)\s+[^\r\n]*factory_reset') {
            throw "Executing factory reset is forbidden"
          }
          if(-not $runner.Contains('if($FlashFirmware)')){throw "Flash is not gated"}
          if(-not $runner.Contains('ConfirmedFlash $firmware.image')){throw "Missing explicit flash path"}
          if(-not $serial.Contains('$sp.DtrEnable=$false') -or -not $serial.Contains('$sp.RtsEnable=$false')) {
            throw "Serial capture must not assert reset controls"
          }
          if($runner.Contains('/api/v1/') -or $runner.Contains('Invoke-RestMethod')){
            throw "Controller HTTP use forbidden; controller is BLE-only"
          }
          foreach($required in @('function ParseAdbList','function AssertAdbParserSelfTest','ADB USB setup incomplete','press ENTER to retry ADB','unauthorized','emulator-')) {
            if(-not $runner.Contains($required)){throw "Missing ADB USB diagnostic and retry guard: $required"}
          }
          foreach($required in @('function SelectEspPort','function AssertEspSelectorSelfTest','SelectEspPort -candidates $found','Single ESP port must not scalarize','Multiple ESP ports must fail closed')) {
            if(-not $runner.Contains($required)){throw "Missing strict-mode COM-port selector regression: $required"}
          }
          foreach($required in @('function EnsureGh','function FindGh','Install official GitHub CLI using WinGet now? Type INSTALL','Open GitHub CLI authorization now? Type LOGIN','auth status --hostname github.com','--accept-package-agreements','--accept-source-agreements','$script:sessionStarted=$true')) {
            if(-not $runner.Contains($required)){throw "GitHub CLI setup guard absent: $required"}
          }
          if($runner -match '(?m)^\s*Tool "gh"'){throw "Old hard-fail gh prerequisite remains"}
          if(-not $runner.Contains('if(-not $script:sessionStarted)')) {
            throw "Preflight must report hardware checks NOT RUN"
          }
          if(-not $bat.Contains('OpenTail-Bench.ps1')){throw "Launcher script missing"}
          if(-not $runner.Contains('Read-Host "Type exactly ERASE APP DATA')){throw "Owner approval prompt required"}
          if(-not $runner.Contains('if($answer -cne "ERASE APP DATA")')){throw "Uninstall must fail closed"}
          if(-not $runner.Contains('Install-VerifiedAndroid')){throw "Installed-app fingerprint contract missing"}
          if(-not $runner.Contains('RESULTS.json')){throw "Machine-readable report missing"}
          if(-not $runner.Contains('Get-BenchFailure')){throw "FAST failure classification missing"}
          if(-not $runner.Contains('Get-InstalledFirmwareIdentity')){throw "Installed firmware identity must be observed"}
          if(-not $bat.Contains('SECONDS=30')){throw "FAST default missing"}
          if(-not $bat.Contains('MODE=save') -or -not $bat.Contains('MODE=playback')){throw "Targeted modes missing"}
          if(-not $serial.Contains('$sp.DtrEnable=$false') -or -not $serial.Contains('$sp.RtsEnable=$false')){throw "Receive-only serial safety lost"}
          Write-Host "PASS no controller HTTP, no automatic flash, app-partition only and receive-only serial"
