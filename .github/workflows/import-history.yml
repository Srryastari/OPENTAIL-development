name: Import OpenTail release history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify SHA-256 and preserve originals
        run: python3 scripts/import_library_archive.py
      - name: Commit imported historical releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/library-releases
          if git diff --cached --quiet; then
            echo "No new files"
          else
            git commit -m "archive: import verified historical OpenTail releases"
            git push
          fi
