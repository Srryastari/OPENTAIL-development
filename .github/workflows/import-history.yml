name: Import OpenTail release history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify import branch
        run: |
          test "$GITHUB_REF_NAME" = "automation/github-only-import" || { echo 'Select automation/github-only-import when running this workflow'; exit 1; }
      - name: Verify archive and import history
        run: python3 scripts/import_library_archive.py
      - name: Commit imported originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/library-releases
          if ! git diff --cached --quiet; then
            git commit -m "archive: import verified OpenTail history"
            git push origin HEAD:automation/github-only-import
          fi
