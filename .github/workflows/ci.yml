name: OpenTail CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracked sources and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/HISTORY-POLICY.md
          test -f docs/LIBRARY-INVENTORY.md
          test -f studio/opentail-v0.19.50.htm
          python3 - <<'PY'
          from pathlib import Path
          import html.parser
          class Parser(html.parser.HTMLParser): pass
          p=Path("studio/opentail-v0.19.50.htm")
          parser=Parser()
          parser.feed(p.read_text(encoding="utf-8"))
          print("Studio HTML parse: PASS (syntax-level only)")
          PY
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD || git diff --check
  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CORE native logic tests when source exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f core-firmware/tests/run-host-tests.sh ]; then
            bash core-firmware/tests/run-host-tests.sh
          else
            echo "::notice::CORE active source not imported on this ref. Host logic tests not run."
          fi
      - name: Report firmware compile ownership
        shell: bash
        run: |
          if [ -f core-firmware/CMakeLists.txt ]; then
            echo "::notice::ESP-IDF target build is verified by verify-active-sources.yml core-espidf-build, not by this host-test job."
          fi
  android-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android source import state
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle ]; then
            echo "::notice::Android source detected; APK compile belongs to verify-active-sources.yml android-debug-apk."
          else
            echo "::notice::Android buildable source not present on this ref; APK not built."
          fi
