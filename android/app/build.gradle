plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opentail.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.opentail.android'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.1.24'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
