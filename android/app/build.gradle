plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opentail.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.opentail.android'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '0.2.0-alpha1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native Android Views only; no WebView or AndroidX WebKit dependency.
}
