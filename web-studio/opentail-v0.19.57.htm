/* CORE onboard RGB settings: same minimal OLED / white appearance. */
.ot-core-led-card{border-radius:20px}
.ot-core-led-summary{display:flex;align-items:center;gap:12px;padding:7px 0 3px}
.ot-core-led-summary strong{display:block;font-size:13px;font-weight:600}
.ot-core-led-summary p{margin:4px 0 0}
.ot-core-led-indicator{width:10px;height:10px;flex:none;border-radius:4px;background:#39d3e4;box-shadow:0 0 10px rgba(57,211,228,.28)}
.ot-core-led-card[data-mode="connected"] .ot-core-led-indicator{background:#00ff00;box-shadow:0 0 10px rgba(0,255,0,.3)}
.ot-core-led-card[data-mode="disconnected"] .ot-core-led-indicator,
.ot-core-led-card[data-mode="wifi_ready"] .ot-core-led-indicator{background:#ff9900;box-shadow:0 0 10px rgba(255,153,0,.3)}
.ot-core-led-card[data-mode="bluetooth"] .ot-core-led-indicator{background:#a020ff;box-shadow:0 0 10px rgba(160,32,255,.3)}
.ot-core-led-card[data-mode="wifi_bluetooth"] .ot-core-led-indicator{background:#00ffcd;box-shadow:0 0 10px rgba(0,255,205,.3)}
.ot-core-led-card[data-mode="fault"] .ot-core-led-indicator{background:#ff0000;box-shadow:0 0 10px rgba(255,0,0,.3)}
.ot-core-led-card[data-mode="show_mode"] .ot-core-led-indicator{background:#bc72fa;box-shadow:0 0 10px rgba(188,114,250,.3)}
.ot-core-led-card[data-mode="off"] .ot-core-led-indicator{background:#777;box-shadow:none}
.ot-core-led-card .ot-led-mini-status{font-size:11px;color:var(--ot-muted,#969696);font-weight:500;text-align:right;max-width:52%}

/* CORE v0.1.14 selected-lighting arbitration · read-only status */
.ot-arb-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.ot-arb-summary>div,.ot-arb-side{background:var(--ot-surface,#111);border:1px solid var(--ot-border,#303030);border-radius:12px;padding:12px;min-width:0}
.ot-arb-summary small{display:block;color:var(--ot-muted,#999);font-size:11px;margin-bottom:6px}
.ot-arb-summary strong{font-size:13px;overflow-wrap:anywhere}
.ot-arb-sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.ot-arb-side>strong{font-size:12px;display:block;margin-bottom:10px}
.ot-arb-line{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px solid var(--ot-border,#303030);padding:9px 0;font-size:12px}
.ot-arb-line span{color:var(--ot-muted,#999)}.ot-arb-line b{font-size:12px;font-weight:600}

@media(max-width:480px){.ot-arb-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.ot-arb-sides{grid-template-columns:1fr}}

async function testTrigger(n){

 if(otBenchUncertain||otRecoveryRecord&&!benchBefore){state.status='Saved bench snapshot needs verification. Restore prior lighting before testing';state.triggerStatus=state.status;render();return false;}
 if(!(state.profiles[n]?.zones||[]).length){state.status='Assign at least one section before testing';state.triggerStatus=state.status;render();return false;}
 if(state.benchSignals[n]){state.triggerEditing=n;state.triggerSelectionActive=true;state.triggerStatus=n+' is already active; select Stop Trigger to remove it';render();return true;}
 const previous={...state.benchSignals};state.triggerEditing=n;state.triggerSelectionActive=true;
 // Add this trigger without deactivating other triggers. Overlap is resolved per section by priority.

 if(!ok){state.benchSignals=previous;persist();}
 if(ok){persist();}if(ok)state.triggerStatus='Active: '+Object.keys(state.benchSignals).filter(k=>state.benchSignals[k]).join(' + ')+'. '+state.status;

async function otPlaySequenceStep(run,index){

  render();clearTimeout(otSequenceTimer);

   if(otSequenceRun!==run||run.ended)return;
   const next=index+1;
   if(next<run.steps.length){void otPlaySequenceStep(run,next);return;}
   if(run.repeat||run.shuffle){
    if(run.shuffle){try{run.steps=otSeqCompileSteps(otSeqShuffleCopy(otSequence));}catch(e){otSequenceMessage='Shuffle failed: '+e.message;void otStopSequence();return;}}

// Retired Originals: retain ONLY restoration for interrupted sessions recorded by older releases.
// No custom pixel renderer or browser-streamed effects remain in this build.
const OT_SIG_KEY='ot-signature-snapshot-v1';
let otSigRun=null,otSigStopping=false,otSigRecovery=null;
try{const r=JSON.parse(localStorage.getItem(OT_SIG_KEY)||'null');if(r?.version===1&&Array.isArray(r.snapshot?.seg)&&typeof r.url==='string')otSigRecovery=r;}catch{}
function otSigStop(){return otSigRestorePending()}
async function otSigRestorePending(){
 if(otSigStopping||!otSigRecovery)return false;
 if(!state.connected){state.status='Connect to WLED to restore your legacy Originals snapshot';render();return false;}
 if(normalizeUrl()!==otSigRecovery.url){state.status='Legacy snapshot belongs to '+otSigRecovery.url+'. Connect to that controller first.';render();return false;}
 otSigStopping=true;
 try{
  const before=otSigRecovery.snapshot;
  await queueDevice(otSequenceRestoration(before));
  const now=await getJson('/json/state');
  if(Number(now.bri)!==Number(before.bri)||now.on!==before.on||deviceSegments(before).some(old=>{
   const seg=deviceSegments(now).find(x=>x.id===old.id);
   return !seg||Number(seg.fx)!==Number(old.fx)||JSON.stringify(seg.col)!==JSON.stringify(old.col);
  }))throw Error('WLED state did not match the recovery snapshot');
  localStorage.removeItem(OT_SIG_KEY);otSigRecovery=null;
  state.status='Legacy Originals lighting snapshot restored and verified';return true;
 }catch(e){state.status='Legacy Originals recovery not confirmed: '+e.message+'; inspect physical LEDs';return false;}
 finally{otSigStopping=false;render()}
}

function otTriggerBatchApply(k,v){
 const names=otSelectedTriggers();if(names.length<2)return false;
 if(k==='pattern'){v=otCanonicalEffect(v);if(!v){otShowToast('Choose a supported 1D effect',true);return false}}
 if(k==='color'&&!/^#[0-9a-f]{6}$/i.test(v))return false;
 if(k==='brightness'||k==='speed'||k==='intensity'){v=Number(v);if(!Number.isFinite(v))return false;v=Math.round(Math.max(k==='brightness'?1:0,Math.min(100,v)))}
 const affected=[];
 for(const n of names){
  const p=state.profiles[n];if(!p)continue;
  p[k]=v;
  if(k==='pattern')p.pattern=v;
  p.sectionAnimations||={};
  for(const id of p.zones||[]){
   const a=p.sectionAnimations[id]||{};
   a[k]=v;
   if(k==='speed')a.speedRaw=Math.round(v*2.55);
   if(k==='intensity')a.intensityRaw=Math.round(v*2.55);
   p.sectionAnimations[id]=a;
  }
  affected.push(n);
 }
 if(!persist()){otShowToast('Could not save multi-trigger changes',true);return false}
 state.triggerStatus='Updated '+k+' in '+affected.join(', ')+' · other settings preserved';
 render();if(state.connected&&affected.some(n=>state.benchSignals[n]))applyBenchTriggers();
 return true;
}
function otTriggerBatchAssign(zoneId,on){
 if(!state.layout.some(z=>z.id===zoneId))return;
 const previous=otSelectedTriggers().map(n=>[n,[...(state.profiles[n].zones||[])]]);
 for(const [n] of previous){
  const p=state.profiles[n],ids=new Set(p.zones||[]);
  if(on)ids.add(zoneId);else ids.delete(zoneId);
  p.zones=[...ids];
 }
 if(!persist()){for(const [n,ids] of previous)state.profiles[n].zones=ids;render();return}
 state.triggerStatus=(on?'Assigned':'Unassigned')+' zone on '+previous.length+' selected triggers';
 render();if(state.connected&&previous.some(([n])=>state.benchSignals[n]))applyBenchTriggers();
}
function otTriggerBatchMarkup(){

 const hazards=document.getElementById('ot-hazard-sim')?.checked!==false;
 const sides=['left','right'];
 root.innerHTML=sides.map(side=>{
  const enabled=hazards||side==='left',profile=state.profiles?.[side==='left'?'Left Turn':'Right Turn'],zone=state.layout.find(z=>profile?.zones?.includes(z.id))||state.layout.find(z=>z.vehicleSide===side),x=otTurnModel(c,!!zone?.reverse,t);if(hazards&&c.hazard==='static')x.fraction=x.active?1:0;
  const lit=enabled&&x.active?Math.max(1,Math.round(x.fraction*12)):0;
  const cells=Array.from({length:12},(_,i)=>`<span style="flex:1;height:17px;border-radius:3px;background:${(x.direction<0?11-i:i)<lit?'#fbbf24':'#303832'}"></span>`).join('');

 }).join('')+`<p class="small muted">Preview time: ${t} ms · ${c.sweepMs>c.pulseHighMs?'Sweep exceeds high pulse; preview clips it to the active window.':'Sweep fits the simulated high pulse.'} This preview sends no WLED commands.</p>`;
}

function otCoreNormalizeUrl(){
  let val=String(otCoreAddress||'').trim();
  if(!/^https?:\/\//i.test(val))val='http://'+val;
  let u;try{u=new URL(val)}catch{throw Error('Enter a controller IP address, e.g. http://192.168.4.1')}
  if(!['http:','https:'].includes(u.protocol)||!u.hostname||u.username||u.password||u.pathname!=='/'||u.search||u.hash)throw Error('Use only a plain HTTP(S) controller address');
  if(location.protocol==='https:'&&u.protocol==='http:')throw Error('HTTP CORE cannot be reached from a secure HTTPS page. Open Studio from http://192.168.4.1/studio instead.');
  return u.origin;
}
async function otCoreRequest(path,body,timeout=3500){
  const url=otCoreNormalizeUrl()+path;
  const opts={method:body===undefined?'GET':'POST',cache:'no-store',signal:AbortSignal.timeout(timeout)};
  if(body!==undefined){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(body)}
  const r=await fetch(url,opts);
  if(!r.ok)throw Error('CORE HTTP '+r.status);
  const data=await r.json();
  if(!data||typeof data!=='object'||data.error||data.ok===false)throw Error(String(data?.error||'CORE returned an invalid response'));
  return data;
}

function otCoreValidateCapabilities(data){

  if(data.bench_only!==true||data.studio_wled_api_compatible!==false)throw Error('Unknown CORE capabilities. No commands sent.');

}

    otShowToast('Stop and restore the active WLED bench session before switching controllers.',true);return;
  }
  if(next==='core'){
    if(state.connected)disconnectWled();
    if(state.connected)return;
  }else if(next==='wled'){
    if(otCoreConnected)void otCoreSession(false).catch(()=>{});

  }
  otControllerMode=next;

  // or reuse a stale WLED catalog while selecting native Bluetooth effects.
  state.wledEffects=[];state.wledPalettes=[];otChosenEffectId=null;

async function otCorePoll(){

 try{
   // Keep the onboard green "Studio connected" status alive, without POSTing every 400 ms.
   if(otCoreLedSupported()&&Date.now()-otCoreHeartbeatAt>=3000){await otCoreSession(true);otCoreHeartbeatAt=Date.now();}
   const started=performance.now();
   const current=await otCoreRequest('/api/v1/status',undefined,2600);
   if(stamp!==otCoreStatusEpoch||otCoreCommandPending||!otCoreConnected)return;
   if(current.bench_only!==true||otCoreMask(current,'input_mask')===null)throw Error('Invalid CORE status');
   otCoreStatus=current;otCoreFaults=0;otCoreMonitorSampleAt=Date.now();otCoreMonitorLatencyMs=performance.now()-started;otCorePaint();
 }catch(e){
   if(stamp!==otCoreStatusEpoch||!otCoreConnected)return;

   if(otCoreFaults>=3){otCoreConnected=false;otCoreMonitorSampleAt=0;otCoreMessage+=' · Disconnected; reconnect when reachable.';render();}

function otCoreQueueCommand(path,body,label){
 if(!otCoreConnected){otCoreMessage='Connect to CORE first.';otCorePaint();return Promise.resolve(false)}
 otCoreCommandPending++;otCoreStatusEpoch++;
 const run=async()=>{
   if(!otCoreConnected)throw Error('CORE disconnected');
   await otCoreRequest(path,body,5000);
   const d=await otCoreRequest('/api/v1/status',undefined,3000);
   if(d.bench_only!==true)throw Error('Invalid CORE readback');
   otCoreStatus=d;otCoreMonitorSampleAt=Date.now();otCoreMessage=label+' · controller acknowledged · '+new Date().toLocaleTimeString();otCorePaint();
   return true;

}

/* CORE v0.1.18 Universal Trigger Manager. Entirely independent from WLED editor.
 * Physical mappings are loaded/saved on CORE, never from a local-only draft.
 */
const OT_TM_FUNCTIONS=[['disabled','Disabled'],['park','Parking'],['brake','Brake'],['left','Left turn'],['right','Right turn'],['reverse','Reverse'],['aux1','Auxiliary 1'],['aux2','Auxiliary 2'],['aux3','Auxiliary 3']];

   data.inputs.every((x,i)=>x.index===i+1&&Number.isInteger(x.gpio)&&names.includes(x.function));

async function otTMRead(){

  otTMSaveState=data.saved_on_device?'saved':'default';otTMMessage=data.saved_on_device?'Loaded saved mapping from CORE.':'Loaded original default mapping; not yet explicitly saved.';
  return true;
 }catch(e){otTMSaveState='failed';otTMMessage='Read failed: '+e.message;return false;}

}

function otTMRestoreDefaults(){

async function otTMSave(){

 otTMBusy=true;otTMMessage='Saving trigger mapping on CORE…';render();
 try{

  if(!otTMValidResponse(response))throw Error('Unexpected CORE save response');
  const verify=await otCoreRequest('/api/v1/triggers',undefined,4000);
  if(!otTMValidResponse(verify)||!verify.saved_on_device||
     verify.inputs.some((x,i)=>x.function!==payload.inputs[i].function))throw Error('CORE readback disagrees with requested mapping');
  otTMData=verify;otTMDraft=verify.inputs.map(({index,gpio,function:fn})=>({index,gpio,function:fn}));
  otTMSaveState='saved';otTMMessage='Saved and verified by CORE readback. Trigger mapping survives restart.';
 }catch(e){otTMSaveState='failed';otTMMessage='Save not confirmed: '+e.message+' · Draft retained. Previous device profile may still be active.';}
 finally{otTMBusy=false;render();}
}
function otTriggerManagerCard(){

 if(!active||!otTMDraft)return `<section class="card ot-tm-card"><div class="line"><h2>Universal Trigger Manager</h2><span class="ot-native-pill">${active?'NOT LOADED':'OFFLINE'}</span></div><p class="small muted">8 software-assignable optocoupler inputs · CORE v0.1.18+ · bench only.</p><p class="ot-core-help">${esc(otTMMessage)}</p><button class="btn primary" type="button" ${active&&!otTMBusy?'':'disabled'} onclick="otTMRead()">Load trigger mapping</button></section>`;

/* OpenTail CORE Universal Output Manager v1. Two physical channels, five configurable zones each.
 * NVS is the source of truth; this draft never claims to have saved until readback succeeds.
 * WLED Layout remains independent. Physical LEDs still require level-shifter validation.
 */
let otOMData=null,otOMDraft=null,otOMSelected=0,otOMBusy=false,otOMMessage='Connect CORE to load output configuration.',otOMSaveState='not-loaded';
const OT_OM_ROLES=[['off','Disabled'],['park_brake','Parking + Brake'],['parking','Parking'],['brake','Brake'],['left_turn','Left Turn'],['right_turn','Right Turn'],['reverse','Reverse'],['aux1','Aux 1'],['aux2','Aux 2'],['aux3','Aux 3'],['decorative','Show only']];
const OT_OM_COLORS=['RGB','RBG','GRB','GBR','BRG','BGR'];
function otOMSupported(){return otControllerMode==='core'&&otCoreCaps?.output_manager_v1===true;}
function otOMClone(x){return JSON.parse(JSON.stringify(x));}
async function otOMRead(){
 if(!otOMSupported()||!otCoreConnected)return;
 otOMBusy=true;otOMMessage='Loading saved configuration from CORE…';
 try{
  const data=await otCoreRequest('/api/v1/outputs',undefined,4000);
  if(data.revision!==2||!Array.isArray(data.outputs)||data.outputs.length!==2||data.allocated_pixels_per_output!==522)throw Error('Unsupported output configuration version');
  otOMData=data;otOMDraft=otOMClone(data.outputs);otOMSaveState='saved';
  otOMMessage=data.saved_on_device?'Configuration loaded from CORE flash memory.':'Using firmware defaults. Flash storage status needs attention.';
 }catch(e){otOMMessage='Could not read Output Manager: '+e.message;otOMSaveState='failed';}
 finally{otOMBusy=false;if(otControllerMode==='core'&&['home','scenes','layout'].includes(state.tab))render();}
}
function otOMEdit(key,value,zone=-1){
 if(!otOMDraft||otOMBusy)return;
 const o=otOMDraft[otOMSelected];if(!o)return;
 if(zone<0){if(key==='pixels')o.pixels=Math.floor(Number(value));else o[key]=String(value);}
 else{const z=o.zones[zone];if(!z)return;if(key==='pixels')z.pixels=Math.floor(Number(value));else z[key]=String(value);}
 otOMSaveState='unsaved';otOMMessage='Unsaved changes · Review zone total before saving.';
 const msg=document.getElementById('ot-om-message');if(msg)msg.textContent=otOMMessage;
 const total=document.getElementById('ot-om-total');if(total){const sum=o.zones.reduce((n,z)=>n+(Number(z.pixels)||0),0);total.textContent=`${sum} assigned of ${o.pixels} active pixels${sum!==o.pixels?' · Must match':''}`;total.classList.toggle('error',sum!==o.pixels);}
 const save=document.getElementById('ot-om-save');if(save)save.disabled=false;
}
function otOMSelect(i){if(otOMBusy||!otOMDraft)return;otOMSelected=i;render();}
function otOMAddZone(){
 const o=otOMDraft?.[otOMSelected];if(!o||otOMBusy||o.zones.length>=8)return;
 o.zones.push({name:`Zone ${o.zones.length+1}`,pixels:0,role:'decorative'});
 otOMSaveState='unsaved';otOMMessage='Zone added to draft · Save to CORE when ready.';render();
}
function otOMRemoveZone(i){
 const o=otOMDraft?.[otOMSelected];if(!o||otOMBusy||o.zones.length<=1)return;
 o.zones.splice(i,1);otOMSaveState='unsaved';otOMMessage='Zone removed from draft. Verify assigned count, then Save.';render();
}
function otOMCalibrate(key,i,value){
 const o=otOMDraft?.[otOMSelected];if(!o||otOMBusy)return;
 o.calibration ||= {rgb_gain:[255,255,255],white_gain:[255,255,255],gamma_enabled:false};
 if(key==='gamma_enabled')o.calibration.gamma_enabled=Boolean(value);
 else o.calibration[key][i]=Math.min(255,Math.max(0,Math.round(Number(value)||0)));
 otOMSaveState='unsaved';otOMMessage='Calibration changed in draft · Save to CORE to apply.';render();
}
function otOMGS400Main(){
 if(!otOMDraft||otOMBusy)return;
 const o=otOMDraft[otOMSelected];
 o.name=otOMSelected===0?'GS400 Left Main':'GS400 Right Main';
 o.pixels=522;
 const roles=['park_brake',otOMSelected===0?'left_turn':'right_turn','reverse','park_brake','off'];
 o.zones=['Top Tail','Turn Signal','Reverse','Bottom Tail','Trunk (not fitted)'].map((name,i)=>({name,pixels:[118,109,42,253,0][i],role:roles[i]}));
 otOMSaveState='unsaved';otOMMessage='522-pixel main-housing draft ready. Existing corrected color order kept. Review then save to CORE.';render();
}
function otOMExample(){
 if(!otOMDraft||otOMBusy)return;
 const o=otOMDraft[otOMSelected],names=['Tail A','Turn','Reverse','Tail B','Tail C'];
 o.name='Pixel OUT '+(otOMSelected+1);o.pixels=30;o.color_order='BRG';
 o.zones=names.map((name,i)=>({name,pixels:6,role:i===1?(otOMSelected===0?'left_turn':'right_turn'):i===2?'reverse':'park_brake'}));
 otOMSaveState='unsaved';otOMMessage='Example loaded as an unsaved draft · Use Save to write CORE.';render();
}
async function otOMSave(){
 if(!otOMSupported()||!otCoreConnected||!otOMDraft||otOMBusy)return;
 const c=otOMDraft[otOMSelected],sum=c.zones.reduce((a,z)=>a+Number(z.pixels||0),0);
 if(!Number.isInteger(c.pixels)||c.pixels<1||c.pixels>522||sum!==c.pixels||
    c.zones.length<1||c.zones.length>8||c.zones.some(z=>!Number.isInteger(z.pixels)||z.pixels<0)){
  otOMSaveState='unsaved';otOMMessage='Add 1–8 zones whose lengths total the active pixel count (1–522). Zero-length zones are allowed.';render();return;
 }
 otOMBusy=true;otOMMessage='Saving to CORE flash…';const el=document.getElementById('ot-om-message');if(el)el.textContent=otOMMessage;
 try{
  const payload={index:otOMSelected,name:c.name,pixels:c.pixels,color_order:c.color_order,
     calibration:c.calibration,zones:c.zones.map(z=>({name:z.name,pixels:z.pixels,role:z.role}))};
  await otCoreRequest('/api/v1/outputs',payload,6000);
  const verify=await otCoreRequest('/api/v1/outputs',undefined,4000);
  const back=verify.outputs?.[otOMSelected];
  if(!verify.saved_on_device||!back||JSON.stringify({name:back.name,pixels:back.pixels,color_order:back.color_order,calibration:back.calibration,zones:back.zones.map(z=>({name:z.name,pixels:z.pixels,role:z.role}))})!==JSON.stringify({name:payload.name,pixels:payload.pixels,color_order:payload.color_order,calibration:payload.calibration,zones:payload.zones})){
    throw Error('Readback did not match saved output map');
  }
  otOMData=verify;otOMDraft=otOMClone(verify.outputs);otOMSaveState='saved';
  otOMMessage='Saved to CORE and verified by device readback. Configuration persists after restart.';
 }catch(e){otOMSaveState='failed';otOMMessage='Save not confirmed: '+e.message+' · Changes remain in the draft.';}
 finally{otOMBusy=false;render();}
}

  <div class="chiprow">${otOMDraft.map((o,i)=>`<button type="button" class="chip ${otOMSelected===i?'active':''}" aria-pressed="${otOMSelected===i}" onclick="otOMSelect(${i})">${esc(o.name)}</button>`).join('')}</div>

  <label class="field">Pixel color order<select onchange="otOMEdit('color_order',this.value)">${OT_OM_COLORS.map(v=>`<option value="${v}" ${c.color_order===v?'selected':''}>${v}</option>`).join('')}</select></label>
  <div class="ot-om-zones">${c.zones.map((z,i)=>`<div class="ot-om-zone"><div class="ot-om-zone-head"><strong>Zone ${i+1}</strong><small>${esc(c.name)} · ${esc(z.role)}</small><button type="button" class="btn" onclick="otOMRemoveZone(${i})" ${c.zones.length===1?'disabled':''}>Delete</button></div>
   <div class="ot-om-zone-fields"><label class="field">Name<input aria-label="Zone ${i+1} name" maxlength="24" value="${esc(z.name)}" oninput="otOMEdit('name',this.value,${i})"></label>
   <label class="field">Pixels<input aria-label="Zone ${i+1} pixels" type="number" min="0" max="522" value="${z.pixels}" oninput="otOMEdit('pixels',this.value,${i})"></label>
   <label class="field">Trigger role<select aria-label="Zone ${i+1} trigger role" onchange="otOMEdit('role',this.value,${i})">${OT_OM_ROLES.map(([v,label])=>`<option value="${v}" ${z.role===v?'selected':''}>${label}</option>`).join('')}</select></label></div></div>`).join('')}<div class="btnrow"><button type="button" class="btn" onclick="otOMAddZone()" ${c.zones.length>=8?'disabled':''}>＋ Add Zone</button></div></div>
  <div class="card" style="margin-top:14px"><h3>Decorative color & white correction</h3><p class="small muted">Per-output tuning applies to shows/demos only. Brake, turn and parking trigger colors remain unmodified.</p>
  ${[['rgb_gain','RGB calibration'],['white_gain','Neutral white balance']].map(([key,label])=>`<div><strong>${label}</strong><div class="ot-native-grid">${['Red','Green','Blue'].map((n,i)=>`<label class="field">${n}<input type="number" min="0" max="255" value="${c.calibration?.[key]?.[i]??255}" onchange="otOMCalibrate('${key}',${i},this.value)"></label>`).join('')}</div></div>`).join('')}
  <label><input type="checkbox" ${c.calibration?.gamma_enabled?'checked':''} onchange="otOMCalibrate('gamma_enabled',0,this.checked)"> Gamma correction (optional)</label></div>
  <p class="small ${total!==c.pixels?'error':'muted'}" id="ot-om-total">${total} assigned of ${c.pixels} active pixels${total!==c.pixels?' · Must match':''}</p>

  <button type="button" class="btn" ${otOMBusy?'disabled':''} onclick="otOMRead()">Reload device</button><button type="button" class="btn" ${otOMBusy?'disabled':''} onclick="otOMGS400Main()">GS400 main housing · 522</button><button type="button" class="btn" ${otOMBusy?'disabled':''} onclick="otOMExample()">Reset draft to example</button></div>
  <p class="ot-core-help" id="ot-om-message" role="status" aria-live="polite">${esc(otOMMessage)}</p>

 </section>`;

function otChatAutoSet(n,k,v){
 if(!['Startup','Shutdown'].includes(n))return false;
 const p=state.profiles[n];if(!p)return false;
 if(k==='eventDuration'){v=Number(v);if(!Number.isFinite(v))return false;v=Math.max(.2,Math.min(30,v))}
 else if(k==='eventFx'&&!['Solid','Sweep','Fade','Breathe'].includes(v))return false;
 else if(k==='eventUiEnabled')v=!!v;
 else if(k==='eventUiFadeMs'){v=Number(v);if(!Number.isFinite(v))return false;v=Math.max(0,Math.min(5000,Math.round(v)))}
 const previous=p[k];p[k]=v;
 if(!persist()){p[k]=previous;otShowToast('Could not save event configuration',true);return false}
 otChatEventStop(false);render();return true;
}
function otChatEventStop(update=true){
 cancelAnimationFrame(otChatEventRaf);otChatEventRaf=0;otChatEventPlay=null;
 if(update)render();
}
function otChatEventStart(){
 if(otChatEventPlay){otChatEventStop();return}
 const n=otChatEventName,p=state.profiles[n];if(!p)return;
 otChatEventPlay={name:n,start:performance.now(),duration:Math.max(200,Math.min(30000,(Number(p.eventDuration)||2)*1000)),effect:p.eventFx||'Solid',fadeMs:Math.max(0,Math.min(5000,Number(p.eventUiFadeMs)||0))};
 render();
 const play=otChatEventPlay;
 const tick=(now)=>{
  if(otChatEventPlay!==play)return;
  const x=Math.min(1,Math.max(0,(now-play.start)/play.duration));
  const dots=[...document.querySelectorAll('.ot-chat-event-pixel')];
  for(let i=0;i<dots.length;i++){
   const pos=(i+.5)/Math.max(1,dots.length),lit=play.effect==='Sweep'?pos<=x:
     play.effect==='Fade'?true:play.effect==='Breathe'?true:true;
   // Shutdown must visibly extinguish to exact black; preview never sends device commands.
   const fadeFraction=Math.min(1,play.fadeMs/play.duration);
   const level=play.name==='Shutdown'?(fadeFraction?Math.min(1,(1-x)/fadeFraction):(x<1?1:0)):
     (fadeFraction?Math.min(1,x/fadeFraction):1);
   dots[i].style.background=lit?'#d7d7d7':'#000000';
   dots[i].style.opacity=lit?String(Math.max(0,Math.min(1,
     (play.effect==='Fade'?level:play.effect==='Breathe'?
       level*(.35+.65*Math.sin(x*Math.PI)):play.name==='Shutdown'?level:1)))):'0';
  }
  const v=document.getElementById('ot-chat-event-progress');if(v)v.textContent=Math.round(x*100)+'%';
  if(x<1)otChatEventRaf=requestAnimationFrame(tick);
  else{otChatEventRaf=0;otChatEventPlay=null;const button=document.getElementById('ot-chat-event-play');if(button)button.textContent='▷ Preview offline';}
 };
 otChatEventRaf=requestAnimationFrame(tick);
}
function otChatAutomaticEvents(){
 const n=otChatEventName,p=state.profiles[n]||{},fx=p.eventFx||'Solid',duration=Number(p.eventDuration)||2,fadeMs=Math.max(0,Math.min(5000,Number(p.eventUiFadeMs)||0));
 return `<section class="ot-chat-events card">
  <div class="ot-chat-heading"><div><h2>Automatic Events</h2><p>Design and preview locally · no connection required</p></div></div>
  <div class="ot-chat-event-tabs">${['Startup','Shutdown'].map(name=>`<button type="button" class="ot-chat-pill ${name===n?'ot-chat-primary':''}" aria-pressed="${name===n}" onclick="otChatEventStop(false);otChatEventName='${name}';render()">${name}</button>`).join('')}</div>
  <div class="ot-chat-event-fields">
   <div class="ot-chat-between"><strong>${esc(n)} animation</strong><small>OFFLINE PREVIEW</small></div>
   <label class="ot-chat-field"><input type="checkbox" ${p.eventUiEnabled?'checked':''} onchange="otChatAutoSet('${n}','eventUiEnabled',this.checked)"> Enable ${n} (configuration only)</label>
   <div class="ot-chat-between"><strong>Fade transition</strong><span class="ot-chat-count">${fadeMs} ms</span></div>
   <input type="range" min="0" max="5000" step="50" value="${fadeMs}" oninput="otChatPreviewFade('${n}',this.value)" onchange="otChatAutoSet('${n}','eventUiFadeMs',this.value)" aria-label="Offline event fade duration">
   <label class="ot-chat-field">Animation<select class="ot-chat-input" onchange="otChatAutoSet('${n}','eventFx',this.value)">${['Solid','Sweep','Fade','Breathe'].map(a=>`<option value="${a}" ${String(fx).toLowerCase()===a.toLowerCase()?'selected':''}>${a}</option>`).join('')}</select></label>
   <div class="ot-chat-between"><strong>Duration</strong><span class="ot-chat-count">${duration.toFixed(1)} sec</span></div>
   <input type="range" min=".2" max="30" step=".1" value="${Math.min(30,duration)}" onchange="otChatAutoSet('${n}','eventDuration',this.value)" aria-label="Automatic event duration">
   <button type="button" id="ot-chat-event-play" class="ot-chat-pill ot-chat-primary ot-chat-full" onclick="otChatEventStart()">${otChatEventPlay?'■ Stop preview':'▷ Preview offline'}</button>
   <div class="ot-chat-between"><strong>LED preview</strong><small id="ot-chat-event-progress">0%</small></div>
   <div class="ot-chat-led-strip ot-chat-event-strip" aria-label="Offline automatic-event animation preview">${Array.from({length:16},()=>'<span class="ot-chat-event-pixel"></span>').join('')}</div>
   <p class="ot-chat-hint">SIM only. Enable and fade are saved UI configuration, not wired to ignition detection or automatic CORE playback. Preview sends no WLED, CORE, Bluetooth, or vehicle commands. Device testing is a separate bench action.</p>
  </div>
 </section>`;
}

function otStudioRoute(tab){
 if(tab==='builder'&&otConceptActive==='events')return otChatAutomaticEvents();
 if(otControllerMode==='core')return ({
  home:otCoreHome,
  device:()=>otCoreDevice()+otAppearanceCard(),
  scenes:()=>scenes()+`<details class="card ot-core-advanced"><summary>CORE connection and capability notes</summary>${otCoreWorkspaceBanner('Show Modes')}</details>`,
  builder:()=>builder()+`<details class="card ot-core-advanced"><summary>CORE physical trigger input mapping · Advanced</summary>${otTriggerManagerCard()}${otCoreWorkspaceBanner('Triggers')}</details>`,
  layout:()=>layout()+`<details class="card ot-core-advanced"><summary>CORE hardware output mapping · Advanced</summary>${otOutputManagerCard()}${otCoreWorkspaceBanner('Layout')}</details>`,
  diagnostics:otCoreDiagnostics
 })[tab]();
 return ({home,scenes,builder,layout,device:()=>device()+otAppearanceCard(),diagnostics})[tab]();
}

function device(){return otCoreControllerPicker()+`<div class="card"><div class="line"><h2>Live Connection Status</h2><span class="status-pill ${state.connected?'is-connected':'is-disconnected'}"><i class="status-dot"></i>${state.connected?'Connected':'Disconnected'}</span></div><div class="statbar"><div class="stat"><strong>${state.wledInfo?.leds?.count??'—'}</strong><span>Controller LEDs</span></div><div class="stat"><strong>${state.wledEffects.length}</strong><span>effects</span></div></div><p class="small muted">${esc(state.status)}</p></div>${otRecoveryBanner()}<div class="card"><h2>Controller Connection</h2>${field('WLED address',state.url,'text','placeholder="http://4.3.2.1"',`oninput="set('url',this.value,false)"`)}<div class="btnrow">${button('Connect','connectWled()','primary')}${button('Disconnect','disconnectWled()')}${button('Full WLED controls ↗','otOpenWledUi()')}</div></div>${otColorTestPanel()}<div class="card"><h2>Project Backup</h2><div class="btnrow">${button('Export project','exportProject()','primary')}<label class="btn">Import project<input type="file" accept="application/json" style="display:none" onchange="importProject(this.files[0])"></label></div></div>`}
function otAbout(){alert('OpenTail Studio v'+OT_VERSION+'\nCORE Alpha integration with original Studio Show Modes, Triggers, Layout and Universal Effect Editor visible for local editing. CORE firmware supports temporary native effects, 8 configurable input functions and 2 independently mapped outputs; advanced Studio designs remain local only. Shared effect editor, robust Stop & Restore with readback, live shuffled titles, optional shared sequence palette, controller-authentic palette previews and inline Fx/Bg/Cs slots. Previous:  custom software triggers, one-tap assignments, 1D effect filtering, presets, simplified events, obsolete Originals player removed (legacy restoration retained); effect-specific Foreground, Background and Accent controls; batched color readback; compact trigger cards, session-only animation clipboard, selective multi-section paste and Undo. Hardware ACC triggering and CORE animation firmware remain future work.');}
const OT_NAV_ICONS={
 home:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 device:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/>',
 scenes:'<path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7zM19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',
 builder:'<path d="M8 3v18M16 3v18M3 8h18M3 16h18"/><circle cx="8" cy="8" r="2"/><circle cx="16" cy="16" r="2"/>',
 layout:'<rect x="2" y="3" width="20" height="18" rx="3"/><path d="M2 10h20M10 10v11"/>',
 diagnostics:'<path d="M2 13h4l3-7 4 12 3-6h6"/>'
};
function otNavIcon(id){return '<svg class="ot-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(OT_NAV_ICONS[id]||OT_NAV_ICONS.home)+'</svg>'}
const OT_PAGE_SUBS={home:'Your vehicle lighting, at a glance.',device:'Controllers, connections and safe bench testing.',scenes:'Create lighting effects, sequences and presets.',builder:'Configure lighting behaviors and vehicle events.',layout:'Organize sections and pixel output mapping.',diagnostics:'Health, logs and controller capabilities.'};
function otPageIntro(){const tab=TABS.find(item=>item[0]===state.tab)||TABS[0];return `<section class="ot-page-intro"><div><div class="ot-eyebrow">${otControllerMode==='core'?'CORE WORKSPACE':'WLED WORKSPACE'} <span aria-hidden="true">/</span> ${esc(state.projectName||'Untitled project')}</div><h1>${esc(tab[2])}</h1><p>${OT_PAGE_SUBS[tab[0]]||''}</p></div><div class="ot-mode-tag">${otControllerMode==='core'?'CORE Alpha':'WLED'}</div></section>`;}
function render(){document.documentElement.dataset.otTheme=otTheme;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',otTheme==='light'?'#ffffff':'#000000');document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="logo"><div class="mark" aria-hidden="true"><svg viewBox="0 0 28 28" width="23" height="23" fill="none"><path d="M14 2 17.6 10.4 26 14l-8.4 3.6L14 26l-3.6-8.4L2 14l8.4-3.6L14 2Z" fill="currentColor"/></svg></div><div><div class="brand">OpenTail <span>Studio</span></div><div class="sub">Automotive lighting studio</div></div></div><span id="ot-save-failure" class="ot-save-failure" role="alert" ${otSaveState==='failed'?'':'hidden'}>⚠ Save failed</span>${otThemeShortcut()}<span class="status-pill ${(otControllerMode==='core'?otCoreConnected:state.connected)?'is-connected':'is-disconnected'}"><i class="status-dot"></i>${(otControllerMode==='core'?otCoreConnected:state.connected)?'Online':'Offline'}</span></header><nav class="tabs">${TABS.map(([id,ic,t])=>`<button class="tab ${state.tab===id?'active':''}" ${state.tab===id?'aria-current="page"':''} onclick="go('${id}')">${otNavIcon(id)}<span>${t}</span></button>`).join('')}</nav>${otControllerMode==='wled'?otSequenceGlobalControl():''}<main>${otPageIntro()}${otConceptNav()}${otStudioRoute(state.tab)}</main><footer class="footer"><span>OpenTail Studio · Bench / design</span><button onclick="otAbout()" class="ot-version">v${OT_VERSION}</button></footer></div>${otUEMarkup()}`;otPaintAllRanges();otPeekPaint();if(otSim.active||otUE)otSimAnimate();if(state.tab==='builder')otPaintTurnPreview();if(otControllerMode==='core'&&state.tab==='diagnostics'){otCorePaintInputMonitor();otCorePaintArbitration()}}

otMigrateLegacyDefaultTriggers();
// Existing F1 Brake saved projects retain their settings in a legacy backup; Brake absorbs their section assignments.
if(state.profiles?.['F1 Brake']){const old=state.profiles['F1 Brake'];state.legacyF1Brake ||= structuredClone(old);
 const br=state.profiles.Brake||(state.profiles.Brake=DEFAULT_PROFILE('Brake','automotive','#ff0000'));
 br.zones=[...new Set([...(br.zones||[]),...(old.zones||[])])];delete state.profiles['F1 Brake'];}
document.addEventListener('pointerdown',()=>{otHasUserInteracted=true},{capture:true});
document.addEventListener('keydown',()=>{otHasUserInteracted=true},{capture:true});
document.addEventListener('input',ev=>{if(ev.target?.matches?.('input[type=range]'))otRangeInput(ev.target)},{capture:true});
render();
// Prioritize fast Diagnostics updates; slow down outside Diagnostics. One pending request maximum.
setInterval(()=>{
 if(otControllerMode!=='core'||!otCoreConnected||document.hidden)return;
 const now=Date.now(),period=state.tab==='diagnostics'?400:1800;
 if(now-otCorePollLastStart<period)return;
 otCorePollLastStart=now;void otCorePoll();
},200);
// Age the monitor even if Wi-Fi stops answering; do not show cached inputs as live.
setInterval(()=>{if(otControllerMode==='core'&&state.tab==='diagnostics'){otCorePaintInputMonitor();otCorePaintArbitration()}},250);
if(otCoreOriginIsLocal){state.tab='device';render();Promise.resolve().then(()=>otCoreConnect()).catch(e=>{otCoreMessage='Auto-connect failed: '+e.message;otCorePaint()})}
setInterval(()=>{if(state.tab==='home'||state.tab==='scenes')otPeekPaint();if(otControllerMode!=='wled'||!state.connected||otPeekManualStop||document.hidden)return;const ws=otPeekSocket;if(ws&&ws.readyState===1){const since=Date.now()-(otPeekAt||otPeekOpenedAt);if(since>10000){otPeekStatus='Pixel stream stalled';otPeekSocket=null;try{ws.close()}catch(e){}otPeekPixels=null;otPeekExact=false;otPeekSchedule('Pixel stream stalled')}}else if(!otPeekRetry&&!ws)otPeekSchedule('Pixel stream unavailable')},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(otSimRaf);otSimRaf=0}else if(otSim.active||otUE)otSimAnimate()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&otControllerMode==='wled'&&state.connected&&!otPeekManualStop){if(otPeekSocket?.readyState!==1&&!otPeekRetry)otPeekSchedule('Resuming live preview');otPeekPaint()}});
if(otControllerMode==='wled'&&/^\/opentail(?:-v[0-9.]+)?\.html?$/i.test(location.pathname)){connectWled()}

</script></body></html>
