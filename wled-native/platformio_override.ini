; Separate WLED-native OpenTail experimental firmware. Never replaces ESP-IDF CORE.
; Source pinned by build script to WLED@20e7a717664295eefc6ad77972cee1888d2da072
[env:opentail_s3_n16r8]
extends = env:esp32s3dev_16MB_opi
custom_usermods =
  audioreactive
  opentail_native
build_flags = ${env:esp32s3dev_16MB_opi.build_flags}
  -D OPENTAIL_NATIVE_EXPERIMENTAL=1
; Inherit WLED S3 8MB PSRAM/16MB Flash partition and LED-output configuration.
