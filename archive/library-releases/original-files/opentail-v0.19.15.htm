async function importProject(file){

  const data=JSON.parse(await file.text());
  if(!data||![1,2,3,4].includes(data.version)||!Array.isArray(data.layout)||!data.profiles||typeof data.profiles!=='object'||Array.isArray(data.profiles))throw Error('Invalid project format');
  if(!data.layout.every(z=>z&&typeof z.name==='string'&&Number.isSafeInteger(Number(z.start))&&Number.isSafeInteger(Number(z.length))&&Number(z.start)>=0&&Number(z.length)>0))throw Error('Project contains invalid section ranges');
  otValidProjectExtras(data);
  const previous={layout:state.layout,profiles:state.profiles,removedSections:state.removedSections,selectedPixels:state.selectedPixels,sectionStyles:state.sectionStyles,zoneAliases:state.zoneAliases,zoneRegistryVersion:state.zoneRegistryVersion,selectedZone:state.selectedZone};
  const oldExtras={sequence:structuredClone(otSequence),hardware:structuredClone(otHardware),favorites:structuredClone(otEffectFavorites),failover:structuredClone(otFailover)};
  try{
   state.layout=data.layout;state.removedSections=data.removedSections||[];state.profiles=data.profiles;
   state.selectedPixels=data.selectedPixels||{};state.sectionStyles=data.sectionStyles||{};state.zoneAliases=data.zoneAliases||{};
   state.selectedZone=state.layout[0]?.id||'';
   otMigrateZoneRegistry();otRepairTriggerAssignments();
   state.current=state.profiles.Show?'Show':Object.keys(state.profiles)[0]||'Show';
   if(data.version>=3){
    otSequence=structuredClone(data.sequence||[]);otHardware=structuredClone(data.hardwareProfile||{chip:'WS2815',order:'BRG'});
    otEffectFavorites=structuredClone(data.effectFavorites||[]);
    localStorage.setItem('ot-sequence-v15',JSON.stringify(otSequence));
    localStorage.setItem('ot-hardware-v15',JSON.stringify(otHardware));
    localStorage.setItem(otFavKey,JSON.stringify(otEffectFavorites));
   }
    if(data.version>=4&&data.failoverProfile){otFailover=otNormalizeFailover(data.failoverProfile);otSaveFailover();}
   state.status='Project imported; universal zone IDs and saved data verified';persist();
  }catch(e){Object.assign(state,previous);otSequence=oldExtras.sequence;otHardware=oldExtras.hardware;otEffectFavorites=oldExtras.favorites;otFailover=oldExtras.failover;otSaveFailover();throw e;}
 }catch(e){state.status='Import failed: '+e.message}

function normalizeUrl(){
 let u=String(state.url||'4.3.2.1').trim().replace(/\/+$/,'');
 if(!/^https?:\/\//i.test(u))u='http://'+u;
 let parsed;
 try{parsed=new URL(u)}catch(e){throw Error('Enter a valid WLED address (for example http://4.3.2.1)')}
 if(!['http:','https:'].includes(parsed.protocol)||!parsed.hostname||parsed.username||parsed.password||parsed.search||parsed.hash)
   throw Error('WLED address must be a plain HTTP(S) host, without credentials or query strings');

}

async function connectWled(){

 state.status='Connecting to WLED…';render();
 try{
  const data=await getJson('/json');
  if(!data||!data.info||!data.state)throw Error('Controller returned incomplete WLED status');
  state.connected=true;
  state.wledInfo=data.info;otTestPixelCount=Math.max(1,Number(data.info?.leds?.count)||522);
  state.segmentsSynced=false;
  state.diagnostics='WLED reports '+(data.info?.leds?.count??'?')+' configured pixels, '+(data.state?.seg?.length??'?')+' segments, max '+(data.info?.leds?.maxseg??'?')+' segments.';
  state.wledEffects=Array.isArray(data.effects)?data.effects:[];
  state.wledPalettes=Array.isArray(data.palettes)?data.palettes:[];
  state.status='Connected: '+(data.info.name||'WLED')+' · '+(data.info.ver||'version unknown')+(otRecoveryRecord?' · Saved pre-test state needs manual verification':'');
  persist();render();
  otPeekClose();otPeekManualStop=false;otPeekAttempts=0;
  Promise.resolve().then(()=>refreshRunningEffect()).catch(e=>console.warn('Effect readback:',e));
  try{otPeekConnect()}catch(e){console.warn('Peek:',e)}
  // Optional discovery must not block connection feedback.
  Promise.allSettled([
   state.wledEffects.length?Promise.resolve():getJson('/json/eff').then(v=>{if(Array.isArray(v))state.wledEffects=v}),
   otLoadFxMetadata()
  ]).then(()=>{if(state.connected)render()});
 }catch(e){
  state.connected=false;
  state.status='Connection failed: '+e.message+'. Check WLED address and Wi-Fi.';
  render();otPeekClose();
 }finally{otConnectPending=false}
}
function disconnectWled(){if(otSigRun||otSigStopping||otSigRecovery){state.status='Stop and verify Original FX restoration before disconnecting';render();return;}if(otSequenceRun){state.status='Stop & restore the running sequence before disconnecting';render();return;}otPeekClose();state.connected=false;state.status='Disconnected; local editing remains available';render()}

function otColorTestSegment(s,color){return {id:s.id,on:true,frz:false,fx:0,pal:0,
  col:[hexRgb(color),[0,0,0],[0,0,0]],bri:255};}
async function testWhole(color){
 try{
  otEffectSafetyCheck();
  const before=await getJson('/json/state');
  const targets=deviceSegments(before);
  if(!targets.length)throw Error('No configured WLED segments found');
  otTestPixelCount=Math.max(...targets.map(x=>Number(x.stop)||0),1);
  if(!otColorTestSnapshot)otColorTestSnapshot=JSON.parse(JSON.stringify(before));
  // Master brightness is the only bench brightness control. Per-segment
  // brightness is reset to 255 so an old dimmed section does not tint results.
  const testBri=Math.max(1,Math.round(255*otEffectiveTestBrightness()/100));
  await queueDevice({on:true,bri:testBri,tt:0,seg:targets.map(s=>otColorTestSegment(s,color))});
  otTestLastColor=color;
  state.status='Pure RGB '+color.toUpperCase()+' test at '+otEffectiveTestBrightness()+'% (recommended ceiling '+otTestCeiling()+'%, '+otTestPixelCount+' configured pixels). Hardware current not measured. WLED current limiter must still be configured.';
 }catch(e){state.status='Physical color test failed: '+e.message}
 render();
}
function otColorTestRestoreSegment(s){
 const keep=['on','bri','fx','sx','ix','c1','c2','c3','o1','o2','o3','pal','col','rev','frz','cct'];
 const result={id:s.id};for(const key of keep)if(s[key]!==undefined)result[key]=s[key];return result;
}
async function otRestoreColorTest(){
 try{
  otEffectSafetyCheck();
  if(!otColorTestSnapshot)throw Error('No color test snapshot available in this session');
  const saved=otColorTestSnapshot;
  await queueDevice({on:saved.on,bri:saved.bri,tt:0,seg:deviceSegments(saved).map(otColorTestRestoreSegment)});
  const d=await getJson('/json/state');
  if(d.on!==saved.on||Number(d.bri)!==Number(saved.bri))throw Error('Power/brightness not yet confirmed restored');
  const current=deviceSegments(d),expected=deviceSegments(saved);
  if(expected.some(before=>{const after=current.find(a=>a.id===before.id);return !after||Number(after.fx)!==Number(before.fx)||Number(after.bri)!==Number(before.bri)||JSON.stringify(after.col)!==JSON.stringify(before.col)}))
   throw Error('WLED did not confirm all previous segment colors/brightness/effects; check the physical lights');
  otColorTestSnapshot=null;otTestLastColor=null;
  state.status='Pre-color-test power, brightness, colors and effects restored (readback confirmed)';
 }catch(e){state.status='Color test restore needs attention: '+e.message}

}
async function otPhysicalTestOff(){

 try{
  if(!state.connected)throw Error('Connect to WLED first');
  const d=await getJson('/json/state');
  const seg=(d.seg||[]).filter(x=>Number(x.stop)>Number(x.start)).map(x=>({id:x.id,on:false,frz:false}));
  if(!seg.length)throw Error('No configured WLED segments found');
  await sendWled({tt:0,seg},true,true);
  const check=await getJson('/json/state');
  const remaining=(check.seg||[]).filter(x=>Number(x.stop)>Number(x.start)&&x.on!==false);
  if(remaining.length)throw Error('WLED still reports '+remaining.length+' active segment(s)');
  otTestLastColor=null;
  state.status='Physical test LEDs OFF (all configured segments disabled); WLED controller remains online';
 }catch(e){state.status='Could not verify physical LEDs off: '+e.message}

async function importLiveSegments(){
 try{
  const d=await getJson('/json');const segments=(d.state?.seg||[]).filter(x=>x.stop>x.start);
  if(!segments.length)throw Error('No valid WLED segments');
  if(!confirm('Import '+segments.length+' WLED segments into Arrangement? Existing zone identities and saved animations will be preserved where ranges match. Export your project first if needed. The controller itself will not be changed.'))return;
  const previous=state.layout.slice(), archived=(state.removedSections||[]).slice(),matched=new Set();
  const next=segments.map((seg,i)=>{
   const old=[...previous,...archived].find(z=>!matched.has(z.id)&&Number(z.start)===Number(seg.start)&&Number(z.length)===Number(seg.stop)-Number(seg.start));
   if(old){matched.add(old.id);return {...old,reverse:!!seg.rev};}
   return {id:otNewZoneId(),name:seg.n||'WLED Section '+(i+1),start:Number(seg.start),length:Number(seg.stop)-Number(seg.start),kind:'strip',offsetX:0,offsetY:0,rotation:0,reverse:!!seg.rev,protocol:'WS2815',vehicleSide:'custom',functions:[],controllerId:'default'};
  });
  // Retain unmatched zones as archived definitions; do not silently delete their saved animations.
  state.removedSections=[...archived,...previous].filter((z,i,a)=>!matched.has(z.id)&&a.findIndex(v=>v.id===z.id)===i);
  state.layout=next;state.selectedZone=next[0].id;state.selectedPixel=0;
  otMigrateZoneRegistry();otRepairTriggerAssignments();
  const archivedRefs=otArchivedReferences();
  state.segmentsSynced=true;state.status='Imported '+segments.length+' WLED sections; '+matched.size+' existing zone IDs preserved; '+state.removedSections.length+' archived. '+(archivedRefs.length?archivedRefs.length+' saved trigger assignment(s) still reference archived sections; see Arrangement.':'');
  state.wledInfo=d.info||state.wledInfo;persist();
 }catch(e){state.status='Import failed: '+e.message}
 render();
}
function hexRgb(hex){let h=hex.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)||0)}

function setSectionStyle(id,key,value){state.sectionStyles[id]??={};state.sectionStyles[id][key]=value;persist();if(state.connected){scheduleSection(id)}}
function validateMapping(){
 if(!state.connected)throw Error('Connect to WLED first');
 if(!state.layout.length)throw Error('No sections defined');
 const total=Number(state.wledInfo?.leds?.count),maxSeg=Number(state.wledInfo?.leds?.maxseg??state.wledInfo?.maxseg??16);
 if(!Number.isSafeInteger(total)||total<1)throw Error('Could not verify WLED pixel count');
 const inside=[],outside=[];
 for(const z of state.layout){const start=Number(z.start),len=Number(z.length);
  if(!Number.isSafeInteger(start)||!Number.isSafeInteger(len)||start<0||len<1)throw Error('Invalid range for '+z.name);
  if(start<total&&start+len>total)throw Error(z.name+' crosses the configured '+total+'-pixel limit. Change WLED LED Preferences or the section range first.');
  (start+len<=total?inside:outside).push(z);
 }
 if(!inside.length)throw Error('No complete sections fit inside the '+total+' configured pixels');
 if(inside.length>maxSeg)throw Error('WLED allows '+maxSeg+' segments; '+inside.length+' connected sections requested');
 const sorted=[...inside].sort((a,b)=>a.start-b.start);
 for(let i=1;i<sorted.length;i++)if(Number(sorted[i].start)<Number(sorted[i-1].start)+Number(sorted[i-1].length))throw Error('Sections overlap: '+sorted[i-1].name+' and '+sorted[i].name);
 return {inside,outside,total,maxSeg};
}
async function syncSections(){
 // Segmentation is not a lighting command: preserve power, colors, effects and brightness.
 try{
  const data=await getJson('/json');state.wledInfo=data.info||{};if(otSigRun||otSigStopping||otSigRecovery)throw Error('Stop / restore OpenTail Originals first');if(benchBefore||otRecoveryRecord)throw Error('Stop / restore the bench trigger before synchronizing Arrangement');const scope=validateMapping();
  const before=data.state||await getJson('/json/state');
  const existing=deviceSegments(before);
  const matching=(z)=>existing.find(x=>Number(x.start)===Number(z.start)&&Number(x.stop)===Number(z.start)+Number(z.length));
  const covering=(z)=>existing.find(x=>Number(x.start)<=Number(z.start)&&Number(x.stop)>=Number(z.start)+Number(z.length));
  const updates=scope.inside.map((z,i)=>{
   const source=matching(z)||covering(z)||existing.find(x=>Number(x.start)<=Number(z.start)&&Number(x.stop)>Number(z.start));
   const spec={id:i,start:Number(z.start),stop:Number(z.start)+Number(z.length),rev:!!z.reverse};
   if(source){for(const key of ['on','fx','sx','ix','bri','pal','col','c1','c2','c3','o1','o2','o3','frz'])if(source[key]!==undefined)spec[key]=source[key]}
   else spec.on=false; // Unmapped new sections stay off, without affecting existing ones.
   return spec;
  });
  // Do not delete existing segments automatically; explicit cleanup requires a separate action.
  const response=await queueDevice({seg:updates});
  const after=await getJson('/json/state');
  const physical=deviceSegments(after);
  const missing=scope.inside.filter(z=>!physical.some(x=>Number(x.start)===Number(z.start)&&Number(x.stop)===Number(z.start)+Number(z.length)));
  if(missing.length)throw Error('WLED did not create: '+missing.map(z=>z.name).join(', '));
  if(before.on!==false&&after.on===false)throw Error('Controller power unexpectedly changed to OFF');
  state.segmentsSynced=true;
  state.status='Synced '+scope.inside.length+'/'+state.layout.length+' sections ('+scope.total+' WLED pixels); '+(scope.outside.length?scope.outside.length+' section(s) beyond the connected LED count were left unchanged. ':'')+'Output power and effect settings preserved where possible.';
 }catch(e){state.segmentsSynced=false;state.status='Sync failed: '+e.message}
 persist();render();
}
async function otVerifyMapping(){

 try{const stateJson=await getJson('/json/state'),physical=deviceSegments(stateJson);
 const problems=state.layout.filter(z=>!physical.some(s=>Number(s.start)===Number(z.start)&&Number(s.stop)===Number(z.start)+Number(z.length)));
 const archives=otArchivedReferences();
 state.mappingCheck={at:new Date().toISOString(),matching:state.layout.length-problems.length,total:state.layout.length,missing:problems.map(z=>({id:z.id,name:z.name,start:z.start,length:z.length})),archivedAssignments:archives.map(x=>({trigger:x.trigger,zone:x.zone.name}))};
 diagEvent('mapping-readback',state.mappingCheck);
 state.status=problems.length||archives.length?'Mapping needs attention: '+problems.length+' unmatched active section(s), '+archives.length+' archived trigger reference(s)':'All '+state.layout.length+' active section ranges match WLED segments (read-only)';render();return !problems.length&&!archives.length;
 }catch(e){state.status='Mapping verification failed: '+e.message;render();return false;}
}
async function findPhysicalSegment(z){let d=await getJson('/json/state');let seg=d.seg||[];let actual=seg.find(s=>s.stop>s.start&&s.start===+z.start&&s.stop===+z.start+(+z.length));if(!actual)throw Error('No matching physical WLED segment for '+z.name+' ('+z.start+'–'+(z.start+z.length)+'). Use Sync sections to WLED after verifying the LED count.');return actual.id??seg.indexOf(actual)}

 }catch(e){state.status='Section update failed: '+e.message;render()}}

async function previewProfile(){
 if(!state.connected){state.status='Connect to WLED to preview on strips';statusLine();return}
 try{
  const d=await getJson('/json/state'),phys=deviceSegments(d);if(!phys.length)throw Error('No configured WLED segments');
  const p=profile();let matches=0;
  const seg=phys.map(s=>{let z=state.layout.find(z=>z.start===s.start&&z.start+z.length===s.stop);
   if(z)matches++;

   else if(['chase','scan','wipe','pulse','fade'].includes(p.pattern))fx=state.wledEffects.findIndex(x=>String(x).toLowerCase().includes(p.pattern));
   return {id:s.id,on:enabled,fx:Math.max(0,fx),frz:false,bri:Math.round(p.brightness*2.55),sx:Math.round(p.speed*2.55),ix:Math.round(p.intensity*2.55),col:[hexRgb(p.color),hexRgb(p.secondary)]};

 }catch(e){state.status='Scene failed: '+e.message;statusLine()}

 const options=effects.sort((a,b)=>a.name.localeCompare(b.name)).map(x=>[x.name,x.name]);
 if(current&&!options.some(x=>x[0].toLowerCase()===current.toLowerCase()))options.unshift([current,current+' (unavailable — change selection)']);
 return options;
}
function otZoneRegistryInfo(){return `<div class="card"><h2>Universal Zone Registry</h2><p class="small muted">Stable section IDs do not change when renamed or reordered. WLED IDs are controller-specific.</p>${state.layout.map(z=>`<div class="line"><strong>${esc(z.name)}</strong><small>${esc(z.id)} · ${esc(z.vehicleSide||'custom')} · ${z.start}–${z.start+z.length-1}</small></div>`).join('')}<h3>Archived sections (${state.removedSections.length})</h3><p class="small muted">Archived sections retain saved animations and trigger assignments. Restore only when the pixel range is free.</p>${state.removedSections.map(z=>`<div class="line"><span><strong>${esc(z.name)}</strong><small> · ${z.start}–${z.start+z.length-1}</small></span>${button('Restore',`restoreSection('${z.id}')`)}</div>`).join('')||'<p class="small muted">None</p>'}${otArchivedWarning()}</div>`}

// Pulse-aware turn/hazard configuration and deterministic, offline timing preview.
// These settings are NOT connected to vehicle inputs or time-critical WLED playback.
const OT_TURN_DEFAULT={mode:'sync',sweepMs:280,holdMs:80,hazard:'mirror',pulseHighMs:350,pulseLowMs:350,edgeToleranceMs:60};
function otTurnConfig(){return {...OT_TURN_DEFAULT,...(state.turnTiming||{})}}
function otSetTurnConfig(key,value){
 const c=otTurnConfig();
 if(!Object.hasOwn(OT_TURN_DEFAULT,key))return;
 if(key==='mode'&&!['sync','complete','static'].includes(value))return;
 if(key==='hazard'&&!['mirror','same','static'].includes(value))return;
 if(typeof OT_TURN_DEFAULT[key]==='number'){
  value=Number(value);if(!Number.isFinite(value))return;
  const bounds={sweepMs:[100,500],holdMs:[0,200],pulseHighMs:[150,1000],pulseLowMs:[150,1000],edgeToleranceMs:[0,200]};
  value=Math.max(bounds[key][0],Math.min(bounds[key][1],Math.round(value)));
 }
 c[key]=value;state.turnTiming=c;persist();otPaintTurnPreview();
}
function otTurnModel(c,side,timeMs){
 const period=c.pulseHighMs+c.pulseLowMs;
 const phase=timeMs%period;
 const active=phase<c.pulseHighMs;
 const span=c.mode==='static'?0:Math.min(c.sweepMs,c.pulseHighMs);
 const fraction=!active?0:c.mode==='static'?1:Math.min(1,phase/Math.max(1,span));
 const direction=side==='right'&&c.hazard==='mirror'?-1:1;
 return {active,fraction,direction,clipped:c.sweepMs>c.pulseHighMs};
}
function otPaintTurnPreview(){
 const root=document.getElementById('ot-turn-preview');if(!root)return;
 const c=otTurnConfig(),t=Number(root.dataset.time||0);
 const hazards=document.getElementById('ot-hazard-sim')?.checked!==false;
 const sides=['left','right'];
 root.innerHTML=sides.map(side=>{
  const x=otTurnModel(c,side,t),enabled=hazards||side==='left';if(hazards&&c.hazard==='static')x.fraction=x.active?1:0;
  const lit=enabled&&x.active?Math.max(1,Math.round(x.fraction*12)):0;
  const cells=Array.from({length:12},(_,i)=>`<span style="flex:1;height:17px;border-radius:3px;background:${(x.direction<0?11-i:i)<lit?'#fbbf24':'#303832'}"></span>`).join('');
  return `<div style="margin:9px 0"><strong>${side.toUpperCase()}</strong> · ${enabled&&x.active?'ON':'OFF'}<div style="display:flex;gap:3px;margin-top:5px">${cells}</div></div>`;
 }).join('')+`<p class="small muted">Preview time: ${t} ms · ${c.sweepMs>c.pulseHighMs?'Sweep exceeds high pulse; preview clips it to the active window.':'Sweep fits the simulated high pulse.'} This preview sends no WLED commands.</p>`;
}
function otTurnPreviewStep(){const r=document.getElementById('ot-turn-preview');if(!r)return;const c=otTurnConfig();r.dataset.time=String((Number(r.dataset.time||0)+50)%(c.pulseHighMs+c.pulseLowMs));otPaintTurnPreview()}
function otTurnTimingPanel(){
 const c=otTurnConfig();
 const range=(label,key,min,max,step=10,unit='ms')=>`<label class="field">${label} <output id="ot-timing-${key}">${c[key]} ${unit}</output><input type="range" min="${min}" max="${max}" step="${step}" value="${c[key]}" oninput="otSetTurnConfig('${key}',+this.value);document.getElementById('ot-timing-${key}').textContent=this.value+' ${unit}'"></label>`;
 return `<div class="card"><h2>Turn Signal &amp; Hazard Timing</h2><p class="small muted">Offline configuration and timing simulation only. No 12 V input sensing or real-time turn scheduler exists in this WLED-hosted app. Keep factory indicators functional.</p><label class="field">Playback policy<select onchange="otSetTurnConfig('mode',this.value)"><option value="sync" ${c.mode==='sync'?'selected':''}>Follow factory pulse window</option><option value="complete" ${c.mode==='complete'?'selected':''}>Complete sweep within ON window</option><option value="static" ${c.mode==='static'?'selected':''}>Conventional synchronized flash</option></select></label>${range('Sweep duration','sweepMs',100,500)}${range('End-of-sweep hold (preview parameter)','holdMs',0,200)}<label class="field">Hazard pattern<select onchange="otSetTurnConfig('hazard',this.value)"><option value="mirror" ${c.hazard==='mirror'?'selected':''}>Mirrored sweeps</option><option value="same" ${c.hazard==='same'?'selected':''}>Same-direction sweeps</option><option value="static" ${c.hazard==='static'?'selected':''}>Conventional flash (planned)</option></select></label><h3>Simulated factory flasher</h3>${range('Pulse ON','pulseHighMs',150,1000,10)}${range('Pulse OFF','pulseLowMs',150,1000,10)}${range('Hazard edge tolerance','edgeToleranceMs',0,200,10)}<label class="field"><input id="ot-hazard-sim" type="checkbox" checked onchange="otPaintTurnPreview()"> Simulate both turn inputs (hazards)</label><div id="ot-turn-preview" data-time="0" class="preview" style="padding:12px"></div><div class="btnrow">${button('Advance preview +50 ms','otTurnPreviewStep()')}</div><p class="small muted">Illustrative timing only. Both signals HIGH together does not conclusively identify hazards. The preview never starts real LEDs and these values are not sent to WLED. Actual pulse handling belongs in protected controller firmware.</p></div>`;
}
function builder(){otRepairTriggerAssignments();if(state.triggerSelectionActive===undefined)state.triggerSelectionActive=Object.values(state.benchSignals||{}).some(Boolean);const n=state.triggerEditing&&state.profiles[state.triggerEditing]?state.triggerEditing:'Brake',p=state.profiles[n],z=otZone(),a=otSectionAnimation();return `${otRecoveryBanner()}${otArchivedWarning()}<div class="card"><h2>Trigger Builder</h2><p class="small muted">Select a trigger to edit; Test Trigger replaces the previous active test. Green outline = editing selection. Stop & Restore verifies the original lighting state.</p><div class="ot-trigger-list">${['Park','Brake','Left Turn','Right Turn','Hazards','Reverse','Startup','Shutdown','F1 Brake'].map(t=>`<button class="ot-select ${state.triggerSelectionActive!==false&&n===t?'on':''} ${state.benchSignals[t]?'ot-test-active':''}" onclick="otEditTrigger('${t}')">${esc(t)} ${state.triggerSelectionActive!==false&&n===t?'✓ EDITING':state.benchSignals[t]?(otBenchUncertain?'⚠ UNVERIFIED':'● ACTIVE'):'○'}</button>`).join('')}</div><div class="line"><strong>${state.triggerSelectionActive!==false?'Editing: '+esc(n):'No trigger selected for editing'}</strong><span class="ot-mini">${state.benchSignals[n]?(otBenchUncertain?'UNVERIFIED':'TEST ACTIVE'):'Not active'}</span></div><p class="small muted">${(state.triggerOwners||[]).map(x=>`${esc(x.section)}: ${esc(x.trigger)}`).join(" · ")||"No confirmed active section assignments"}</p><p class="small muted">${(state.triggerConflicts||[]).map(x=>`${esc(x.section)}: ${esc(x.winner)} overrides ${esc(x.previous)}`).join(" · ")}</p><label class="field"><input type="checkbox" ${state.benchIsolation!==false?'checked':''} onchange="otSetBenchIsolation(this.checked)"> Isolate bench tests (temporarily turn off other WLED segments)</label><label class="field"><input type="checkbox" ${state.benchConnectedOnly!==false?'checked':''} onchange="otSetConnectedBenchOnly(this.checked)"> Bench-preview connected sections only (e.g., 522 or 623 LEDs on one side)</label><p class="small muted">Partial bench previews are explicitly labelled and NEVER confirm road-lighting operation for the complete car.</p><p class="small muted">Only one bench trigger runs at a time. Test Brake to replace Park; Stop & Restore returns to the saved pre-test WLED state. A disconnect or failed verification requires manual recovery. Not a road-lighting control system.</p><div class="btnrow">${button('Test Trigger',`testTrigger('${n}')`,'primary')}${button('Stop & Restore','stopTrigger()','danger')}</div></div><div class="notice" role="status">${esc(state.triggerStatus||state.status||'Ready to test')}</div><div class="card"><h2>Section Assignments</h2><p class="small muted">Tap cards to select one or several sections for editing. Checkboxes assign sections to the current trigger; selecting does not change assignments.</p><label class="field"><input type="checkbox" ${otShowAssignments?'checked':''} onchange="otShowAssignments=this.checked;render()"> Show trigger assignments on cards</label><div class="btnrow">${button('Select all','otSelectAllZones()')}${button('Clear selection','otClearMultiZones()')}</div><div class="ot-section-grid">${state.layout.map(s=>`<div class="ot-assign ${otSelection().includes(s.id)?'on':''}"><button type="button" class="ot-assign-select" aria-pressed="${otSelection().includes(s.id)}" onclick="otToggleMultiZone('${s.id}')"><strong>${esc(s.name)} ${otSelection().includes(s.id)?'✓':''}</strong><small>${s.length} LEDs · ${esc(otCleanEffectName(p.sectionAnimations?.[s.id]?.pattern||p.pattern))}</small>${otSectionBadges(s.id)}</button><label><input type="checkbox" ${p.zones.includes(s.id)?'checked':''} onchange="triggerZone('${n}','${s.id}',this.checked)" aria-label="Assign ${esc(s.name)} to ${esc(n)}"> Assigned</label></div>`).join('')}</div><p class="small muted">Green outline = selected for editing · Tags = assigned triggers. Cards show two tags and +N for additional assignments.</p><div class="ot-rename"><label class="field">Section to edit<select id="ot-section-picker" onchange="otSelectZone(this.value)">${state.layout.map(s=>`<option value="${esc(s.id)}" ${z?.id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="field">Rename selected section<input id="ot-rename-input" type="text" maxlength="48" value="${esc(z?.name||'')}" placeholder="Section name" onkeydown="if(event.key==='Enter'){event.preventDefault();otRenameCurrentZone()}"></label><div class="btnrow">${button('Save section name','otRenameCurrentZone()','primary')}</div></div></div>${otMultiEditor()}${otSelection().length>1?'':`<div class="card"><h2>Animation · ${esc(z?.name||'Select section')}</h2><p class="small muted">Sliders update their values immediately. Physical LEDs update while this trigger is actively being bench-tested; otherwise settings are saved for the next test.</p><p class="small muted">${p.sectionAnimations?.[z?.id]?'Custom settings for this section':'Using trigger defaults · changes here create a separate animation'}</p>${dropdown('WLED Effect',otCleanEffectName(a.pattern),otTriggerEffectChoices(a.pattern),"otEditSectionAnimation('pattern',this.value)")}${String(a.pattern).toLowerCase()==='pixel-custom'?`<div class="notice" role="alert"><strong>Custom pixel animation not yet playable.</strong> This saved mode is not a native WLED effect, and the current project does not define its pixel frames. Nothing will be sent during a failed preflight. You can preserve it for a future custom player or explicitly convert this section to static Solid for testing. <div class="btnrow">${button('Convert this section to Solid','otConvertPixelCustomToSolid()')}</div></div>`:''}<div class="two">${field('Fx color',a.color,'color','',`oninput="otEditSectionAnimation(&#39;color&#39;,this.value)"`)}${field('Bg color',a.secondary,'color','',`oninput="otEditSectionAnimation(&#39;secondary&#39;,this.value)"`)}</div><div class="two">${field('Speed',a.speed,'range','min="1" max="100"',`oninput="otEditSectionAnimation(&#39;speed&#39;,+this.value)"`)}${field('Intensity',a.intensity,'range','min="1" max="100"',`oninput="otEditSectionAnimation(&#39;intensity&#39;,+this.value)"`)}</div>${field('Brightness %',a.brightness,'range','min="1" max="100"',`oninput="otEditSectionAnimation(&#39;brightness&#39;,+this.value)"`)}<label class="field"><span>Effect direction (selected section only)</span><select onchange="otEditSectionAnimation('reverseEffect',this.value==='reverse');render()"><option value="forward" ${a.reverseEffect===true?'':'selected'}>Forward</option><option value="reverse" ${a.reverseEffect===true?'selected':''}>Reverse</option></select></label><p class="small muted">Uses WLED segment reverse direction. Directional effects may respond differently; Solid and some effects have no visible direction.</p><div class="btnrow">${button('Copy to assigned sections','otCopySectionAnimation()')}${button('Reset section to trigger defaults','otResetSectionAnimation()')}</div><p class="small muted">Changes auto-save locally as you edit. Check the header indicator for confirmation; export a profile for a portable backup.</p><p class="small muted">If a test fails, check the status above and Diagnostics for missing segment ranges. Each section uses its own matching WLED segment. Unsupported effects or missing segments produce an error rather than silently changing the entire strip. Trigger priority (low → high): Show, Startup, Shutdown, Park, Lock, Unlock, Left Turn, Right Turn, Hazards, Brake, F1 Brake, Reverse. Higher-priority active triggers override lower-priority triggers only on overlapping sections. Bench tests are not road-safe lighting control.</p></div>`}${otTurnTimingPanel()}${otPixelPreview()}`}

function otTriggerColor(k,v){let n=state.triggerEditing&&state.profiles[state.triggerEditing]?state.triggerEditing:'Brake';state.profiles[n][k]=v;persist();if(state.connected&&state.benchSignals[n])applyBenchTriggers()}
function otSelectAll(){otMulti=new Set(state.layout.map(z=>z.id));render()}
function otClearAll(){otMulti.clear();render()}
function otBulkToggle(id,on){on?otMulti.add(id):otMulti.delete(id);render()}
const otOriginalLayout=otBaseArrangementLayout;
function layout(){return `<div class="card"><div class="line"><h2>Section Selection</h2><span class="ot-mini">${otMulti.size}/${state.layout.length} selected</span></div><div class="btnrow">${button('Select All','otSelectAll()','primary')}${button('Deselect All','otClearAll()')}</div>${state.layout.map(z=>`<div class="ot-assign"><label><input type="checkbox" ${otMulti.has(z.id)?'checked':''} onchange="otBulkToggle('${z.id}',this.checked)"> ${esc(z.name)}</label><small>${z.length} LEDs</small></div>`).join('')}<p class="small muted">Selection is for future bulk actions. Lengths and offsets remain independently editable below.</p></div>${otZoneRegistryInfo()}${otOriginalLayout()}`}
function otSetHardware(k,v){otHardware[k]=v;localStorage.setItem('ot-hardware-v15',JSON.stringify(otHardware));render()}
function otColorTestPanel(){const cap=otTestCeiling(),effective=otEffectiveTestBrightness();return `<div class="card"><h2>Physical Color Test</h2><p class="small muted">Test actual RGB colors at a brightness matched approximately to your bench power supply. The previous fixed 8% setting is gone. WLED's electrical current limiter must still be set separately.</p><div class="two"><label class="field">Power supply rating (A)<input type="number" min="1" max="100" step="0.5" value="${otTestSupplyAmps}" onchange="otSetTestSupply(this.value)" aria-label="Actual bench supply rating in amps"></label><div class="stat"><strong id="ot-test-brightness-cap">${cap}%</strong><span>Estimated test brightness ceiling · ${otTestPixelCount} pixels</span></div></div><label class="field ot-slider-label"><span class="ot-slider-heading"><span>Test brightness</span><output id="ot-test-brightness-readout">${effective}%</output></span><input id="ot-test-brightness" type="range" min="1" max="${Math.max(1,cap)}" value="${effective}" aria-label="Physical color test brightness" oninput="otTestBrightnessInput(this)" onchange="otSetTestBrightness(this.value)"></label><p class="small muted">Current slider range automatically considers your entered supply rating and WLED pixel count. Estimate only—not a guaranteed current limit. Increasing amperage here does not change WLED's PSU limiter.</p><div class="btnrow">${button('Red',"testWhole('#ff0000')")}${button('Green',"testWhole('#00ff00')")}${button('Blue',"testWhole('#0000ff')")}${button('White',"testWhole('#ffffff')")}</div><div class="btnrow">${button('Restore previous lighting','otRestoreColorTest()')}${button('LEDs Off','otPhysicalTestOff()','danger')}</div><p class="small muted">For pinkish white despite correct pure RGB colors, compare voltage at the strip and check power injection and WLED white-balance. Keep the known-working BRG order. <a href="${esc(normalizeUrl()+'/settings/leds')}" target="_blank" rel="noopener noreferrer">Set WLED Automatic Brightness Limiter →</a></p></div>`}

function device(){return otFailoverPanel(true)+`<div class="card"><div class="line"><h2>Live Connection Status</h2><span class="status-pill ${state.connected?'is-connected':'is-disconnected'}"><i class="status-dot"></i>${state.connected?'Connected':'Disconnected'}</span></div><div class="statbar"><div class="stat"><strong>${state.wledInfo?.leds?.count??'—'}</strong><span>Controller LEDs</span></div><div class="stat"><strong>${state.wledEffects.length}</strong><span>WLED effects</span></div></div><p class="small muted">${esc(state.status)}</p></div>${otRecoveryBanner()}<div class="card"><h2>Controller Connection</h2>${field('WLED address',state.url,'text','placeholder="http://4.3.2.1"',`oninput="set('url',this.value,false)"`)}<div class="btnrow">${button('Connect','connectWled()','primary')}${button('Disconnect','disconnectWled()')}${button('Sync effects','fetchEffects()')}${button('Full WLED controls ↗','otOpenWledUi()')}</div></div>${otColorTestPanel()}<div class="card"><h2>LED Hardware Profile</h2><p class="small muted">Profile labels only. Changing these controls does not modify WLED LED Preferences or GPIO settings.</p><div class="two">${dropdown('Strip chipset',otHardware.chip,['WS2815','WS2812B','WS2811','WS2814','SK6812 RGBW','GS8208'],`otSetHardware('chip',this.value)`)}${dropdown('Color order',otHardware.order,['RGB','RBG','GRB','GBR','BRG','BGR'],`otSetHardware('order',this.value)`)}</div><div class="notice">Your BTF WS2815 profile is BRG. If solid colors are correct, do not change working WLED hardware color order to troubleshoot palette-based effects.</div></div><div class="card"><h2>Project Backup</h2><div class="btnrow">${button('Export project','exportProject()','primary')}<label class="btn">Import project<input type="file" accept="application/json" style="display:none" onchange="importProject(this.files[0])"></label></div></div>`}
function otAbout(){alert('OpenTail Studio v'+OT_VERSION+'\nIntegrated mobile-first WLED build\nChanges: v0.19.14 adds five original pixel-generated animation previews and experimental WLED bench streaming. v0.19.13 adds adjustable supply-aware bench brightness, WLED full-control access and a working browser-based sequence preview. v0.19.12 color consistency and restore fixes retained. Keeps v0.19.11 UI and save toast. Prior v0.19.9 WLED target/effect fixes and trigger priority retained. Offline dual-ESP32 watchdog profile retained.\nNo automatic takeover firmware/hardware is installed or verified; not a road-lighting safety controller.')}
function render(){document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="logo"><div class="mark">✦</div><div><div class="brand">OpenTail <span>Studio</span></div><div class="sub">Automotive lighting studio</div></div></div><span id="ot-save-failure" class="ot-save-failure" role="alert" ${otSaveState==='failed'?'':'hidden'}>⚠ Save failed</span><span class="status-pill ${state.connected?'is-connected':'is-disconnected'}"><i class="status-dot"></i>${state.connected?'Online':'Offline'}</span></header><nav class="tabs">${TABS.map(([id,ic,t])=>`<button class="tab ${state.tab===id?'active':''}" onclick="go('${id}')">${ic} ${t}</button>`).join('')}</nav><main>${({home,scenes,builder,layout,device,diagnostics})[state.tab]()}</main><footer class="footer"><span>OpenTail Studio · Bench / show only</span><button onclick="otAbout()" class="ot-version">v${OT_VERSION}</button></footer></div><nav class="bottomnav">${TABS.map(([id,ic,t])=>`<button class="${state.tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${t}</button>`).join('')}</nav>`;otPaintAllRanges();otPeekPaint();if(state.tab==='builder')otPaintTurnPreview()}

otMigrateLegacyDefaultTriggers();

document.addEventListener('keydown',()=>{otHasUserInteracted=true},{capture:true});
document.addEventListener('keydown',()=>{otHasUserInteracted=true},{capture:true});
