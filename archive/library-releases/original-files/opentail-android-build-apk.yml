name: Build OpenTail Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get source archive
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          mkdir -p opentail-android
          unzip -q opentail-android-v0.1.0-github-source.zip -d opentail-android
          test -f opentail-android/settings.gradle

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run existing Studio and source checks
        working-directory: opentail-android
        run: python3 qa/check_release.py

      - name: Compile OpenTail Android APK
        working-directory: opentail-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish APK for phone install
        uses: actions/upload-artifact@v7
        with:
          path: opentail-android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
