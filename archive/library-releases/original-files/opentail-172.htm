function otRenameCurrentZone(){const z=otZone(),field=document.getElementById('ot-rename-input');if(!z||!field)return;otRenameZone(z.id,field.value)}
function otSectionAnimation(){const n=state.triggerEditing&&state.profiles[state.triggerEditing]?state.triggerEditing:'Brake',p=state.profiles[n],z=otZone();if(!z)return p;return {...p,...(p.sectionAnimations?.[z.id]||{})}}
function otEditSectionAnimation(k,v){const n=state.triggerEditing&&state.profiles[state.triggerEditing]?state.triggerEditing:'Brake',p=state.profiles[n],z=otZone();if(!z)return;p.sectionAnimations ||= {};p.sectionAnimations[z.id] ||= {};p.sectionAnimations[z.id][k]=v;persist();if(state.connected&&state.benchSignals[n])applyBenchTriggers()}
function otResetSectionAnimation(){const p=state.profiles[state.triggerEditing||'Brake'],z=otZone();if(z&&p.sectionAnimations){delete p.sectionAnimations[z.id];persist();render();if(state.connected&&state.benchSignals[state.triggerEditing])applyBenchTriggers()}}
function otCopySectionAnimation(){const p=state.profiles[state.triggerEditing||'Brake'],z=otZone();if(!z)return;const a=otSectionAnimation();p.sectionAnimations ||= {};for(const id of p.zones)p.sectionAnimations[id]={pattern:a.pattern,color:a.color,secondary:a.secondary,speed:a.speed,intensity:a.intensity,brightness:a.brightness};persist();render();if(state.connected&&state.benchSignals[state.triggerEditing])applyBenchTriggers()}
function otTriggerEffectChoices(current){
 const effects=(state.wledEffects||[]).map((name,id)=>({name,id})).filter(x=>x.name&&x.name!=='-'&&x.name!=='RSVD');
 if(!effects.length)return ['solid','strobe','chase','rainbow','wipe','fade'].map(x=>[x,x+' (connect to verify)']);
 const options=effects.sort((a,b)=>a.name.localeCompare(b.name)).map(x=>[x.name,x.name]);
 if(!options.some(x=>x[0]===current))options.unshift([current,current+' (unavailable — change selection)']);
 return options;
}
function otZoneRegistryInfo(){return `<div class="card"><h2>Universal Zone Registry</h2><p class="small muted">Stable section IDs do not change when renamed or reordered. WLED IDs are controller-specific.</p>${state.layout.map(z=>`<div class="line"><strong>${esc(z.name)}</strong><small>${esc(z.id)} · ${esc(z.vehicleSide||'custom')} · ${z.start}–${z.start+z.length-1}</small></div>`).join('')}<h3>Archived sections (${state.removedSections.length})</h3><p class="small muted">Archived sections retain saved animations and trigger assignments. Restore only when the pixel range is free.</p>${state.removedSections.map(z=>`<div class="line"><span><strong>${esc(z.name)}</strong><small> · ${z.start}–${z.start+z.length-1}</small></span>${button('Restore',`restoreSection('${z.id}')`)}</div>`).join('')||'<p class="small muted">None</p>'}${otArchivedWarning()}</div>`}

function builder(){otRepairTriggerAssignments();const n=state.triggerEditing&&state.profiles[state.triggerEditing]?state.triggerEditing:'Brake',p=state.profiles[n],z=otZone(),a=otSectionAnimation();return `${otRecoveryBanner()}${otArchivedWarning()}<div class="card"><h2>Trigger Builder</h2><p class="small muted">Green outline = editing selection · ACTIVE = bench trigger enabled. Selecting a trigger does not activate it.</p><div class="ot-trigger-list">${['Park','Brake','Left Turn','Right Turn','Hazards','Reverse','Startup','Shutdown','F1 Brake'].map(t=>`<button class="ot-select ${n===t?'on':''} ${state.benchSignals[t]?'ot-test-active':''}" onclick="otEditTrigger('${t}')">${esc(t)} ${n===t?'✓ EDITING':state.benchSignals[t]?(otBenchUncertain?'⚠ UNVERIFIED':'● ACTIVE'):'○'}</button>`).join('')}</div><div class="line"><strong>Editing: ${esc(n)}</strong><span class="ot-mini">${state.benchSignals[n]?(otBenchUncertain?'UNVERIFIED':'TEST ACTIVE'):'Not active'}</span></div><p class="small muted">${(state.triggerOwners||[]).map(x=>`${esc(x.section)}: ${esc(x.trigger)}`).join(" · ")||"No confirmed active section assignments"}</p><p class="small muted">${(state.triggerConflicts||[]).map(x=>`${esc(x.section)}: ${esc(x.winner)} overrides ${esc(x.previous)}`).join(" · ")}</p><div class="btnrow">${button('Test Trigger',`testTrigger('${n}')`,'primary')}${button('Stop Trigger',`otStopSelectedTrigger('${n}')`,'danger')}${button('Stop All','stopTrigger()')}</div></div><div class="notice" role="status">${esc(state.triggerStatus||state.status||'Ready to test')}</div><div class="card"><h2>Section Assignments</h2><p class="small muted">Tap a section to edit its individual animation. Assign it with the checkbox.</p>${state.layout.map(s=>`<div class="ot-assign ${z?.id===s.id?'on':''}"><button type="button" class="ot-assign-select" onclick="otSelectZone('${s.id}')"><strong>${esc(s.name)}</strong><small>${s.length} LEDs · ${esc((p.sectionAnimations?.[s.id]?.pattern||p.pattern))} · ${z?.id===s.id?'EDITING':'Tap to edit'}</small></button><label><input type="checkbox" ${p.zones.includes(s.id)?'checked':''} onchange="triggerZone('${n}','${s.id}',this.checked)" aria-label="Assign ${esc(s.name)}"> Assigned</label></div>`).join('')}<div class="ot-rename"><label class="field">Section to edit<select id="ot-section-picker" onchange="otSelectZone(this.value)">${state.layout.map(s=>`<option value="${esc(s.id)}" ${z?.id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="field">Rename selected section<input id="ot-rename-input" type="text" maxlength="48" value="${esc(z?.name||'')}" placeholder="Section name" onkeydown="if(event.key==='Enter'){event.preventDefault();otRenameCurrentZone()}"></label><div class="btnrow">${button('Save section name','otRenameCurrentZone()','primary')}</div></div></div><div class="card"><h2>Animation · ${esc(z?.name||'Select section')}</h2><p class="small muted">${p.sectionAnimations?.[z?.id]?'Custom settings for this section':'Using trigger defaults · changes here create a separate animation'}</p>${dropdown('WLED Effect',a.pattern,otTriggerEffectChoices(a.pattern),"otEditSectionAnimation('pattern',this.value)")}<div class="two">${field('Fx color',a.color,'color','',`oninput="otEditSectionAnimation(&#39;color&#39;,this.value)"`)}${field('Bg color',a.secondary,'color','',`oninput="otEditSectionAnimation(&#39;secondary&#39;,this.value)"`)}</div><div class="two">${field('Speed',a.speed,'range','min="1" max="100"',`oninput="otEditSectionAnimation(&#39;speed&#39;,+this.value)"`)}${field('Intensity',a.intensity,'range','min="1" max="100"',`oninput="otEditSectionAnimation(&#39;intensity&#39;,+this.value)"`)}</div>${field('Brightness %',a.brightness,'range','min="1" max="100"',`oninput="otEditSectionAnimation(&#39;brightness&#39;,+this.value)"`)}<div class="btnrow">${button('Copy to assigned sections','otCopySectionAnimation()')}${button('Reset section to trigger defaults','otResetSectionAnimation()')}</div><div class="btnrow">${button('Save Trigger Settings','saveStatus()','primary')}</div><p class="small muted">If a test fails, check the status above and Diagnostics for missing segment ranges. Each section uses its own matching WLED segment. Unsupported effects or missing segments produce an error rather than silently changing the entire strip. Trigger priority (low → high): Show, Startup, Shutdown, Park, Lock, Unlock, Left Turn, Right Turn, Hazards, Brake, F1 Brake, Reverse. Higher-priority active triggers override lower-priority triggers only on overlapping sections. Bench tests are not road-safe lighting control.</p></div>${otPixelPreview()}`}

function otTriggerColor(k,v){let n=state.triggerEditing&&state.profiles[state.triggerEditing]?state.triggerEditing:'Brake';state.profiles[n][k]=v;persist();if(state.connected&&state.benchSignals[n])applyBenchTriggers()}
function otSelectAll(){otMulti=new Set(state.layout.map(z=>z.id));render()}
function otClearAll(){otMulti.clear();render()}
function otBulkToggle(id,on){on?otMulti.add(id):otMulti.delete(id);render()}
const otOriginalLayout=otBaseArrangementLayout;
function layout(){return `<div class="card"><div class="line"><h2>Section Selection</h2><span class="ot-mini">${otMulti.size}/${state.layout.length} selected</span></div><div class="btnrow">${button('Select All','otSelectAll()','primary')}${button('Deselect All','otClearAll()')}</div>${state.layout.map(z=>`<div class="ot-assign"><label><input type="checkbox" ${otMulti.has(z.id)?'checked':''} onchange="otBulkToggle('${z.id}',this.checked)"> ${esc(z.name)}</label><small>${z.length} LEDs</small></div>`).join('')}<p class="small muted">Selection is for future bulk actions. Lengths and offsets remain independently editable below.</p></div>${otZoneRegistryInfo()}${otOriginalLayout()}`}
function otSetHardware(k,v){otHardware[k]=v;localStorage.setItem('ot-hardware-v15',JSON.stringify(otHardware));render()}
function otColorTestPanel(){return `<div class="card"><h2>Physical Color Test</h2><p class="small muted">Bench-only test · brightness capped at 15%. Applies to configured WLED segments.</p><label class="field">Test brightness: <b id="ot-test-brightness">${otColorTestBrightness}%</b><input type="range" min="1" max="15" step="1" value="${otColorTestBrightness}" oninput="otColorTestBrightness=Math.max(1,Math.min(15,+this.value));document.getElementById('ot-test-brightness').textContent=otColorTestBrightness+'%'"></label><div class="btnrow">${button('Red',"testWhole('#ff0000')")}${button('Green',"testWhole('#00ff00')")}${button('Blue',"testWhole('#0000ff')")}${button('White',"testWhole('#ffffff')")}${button('Off','otStopShow()','danger')}</div></div>`}
function device(){return `<div class="card"><div class="line"><h2>Live Connection Status</h2><span class="status-pill ${state.connected?'is-connected':'is-disconnected'}"><i class="status-dot"></i>${state.connected?'Connected':'Disconnected'}</span></div><div class="statbar"><div class="stat"><strong>${state.wledInfo?.leds?.count??'—'}</strong><span>Controller LEDs</span></div><div class="stat"><strong>${state.wledEffects.length}</strong><span>WLED effects</span></div></div><p class="small muted">${esc(state.status)}</p></div>${otRecoveryBanner()}<div class="card"><h2>Controller Connection</h2>${field('WLED address',state.url,'text','placeholder="http://4.3.2.1"',`oninput="set('url',this.value,false)"`)}<div class="btnrow">${button('Connect','connectWled()','primary')}${button('Disconnect','disconnectWled()')}${button('Sync effects','fetchEffects()')}</div></div>${otColorTestPanel()}<div class="card"><h2>LED Hardware Profile</h2><p class="small muted">Profile labels only. Changing these controls does not modify WLED LED Preferences or GPIO settings.</p><div class="two">${dropdown('Strip chipset',otHardware.chip,['WS2815','WS2812B','WS2811','WS2814','SK6812 RGBW','GS8208'],`otSetHardware('chip',this.value)`)}${dropdown('Color order',otHardware.order,['RGB','RBG','GRB','GBR','BRG','BGR'],`otSetHardware('order',this.value)`)}</div><div class="notice">Your BTF WS2815 profile is BRG. If solid colors are correct, do not change working WLED hardware color order to troubleshoot palette-based effects.</div></div><div class="card"><h2>Project Backup</h2><div class="btnrow">${button('Export project','exportProject()','primary')}<label class="btn">Import project<input type="file" accept="application/json" style="display:none" onchange="importProject(this.files[0])"></label></div></div>`}
function otAbout(){alert('OpenTail Studio v'+OT_VERSION+'\nIntegrated mobile-first WLED build\nChanges: archived-zone warnings and restore, verified recovery snapshots, project v3 backups, read-only mapping check, reduced legacy UI code.\nBench/show use only; not a vehicle safety controller.')}
function render(){document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="logo"><div class="mark">✦</div><div><div class="brand">OpenTail <span>Studio</span></div><div class="sub">Automotive lighting studio</div></div></div><span class="status-pill ${state.connected?'is-connected':'is-disconnected'}"><i class="status-dot"></i>${state.connected?'Online':'Offline'}</span></header><nav class="tabs">${TABS.map(([id,ic,t])=>`<button class="tab ${state.tab===id?'active':''}" onclick="go('${id}')">${ic} ${t}</button>`).join('')}</nav><main>${({home,scenes,builder,layout,device,diagnostics})[state.tab]()}</main><footer class="footer"><span>OpenTail Studio · Bench / show only</span><button onclick="otAbout()" class="ot-version">v${OT_VERSION}</button></footer></div><nav class="bottomnav">${TABS.map(([id,ic,t])=>`<button class="${state.tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${t}</button>`).join('')}</nav>`;otPeekPaint()}

render();
setInterval(()=>{if(state.tab==='home'||state.tab==='scenes')otPeekPaint();if(!state.connected||otPeekManualStop||document.hidden)return;const ws=otPeekSocket;if(ws&&ws.readyState===1){const since=Date.now()-(otPeekAt||otPeekOpenedAt);if(since>10000){otPeekStatus='Pixel stream stalled';otPeekSocket=null;try{ws.close()}catch(e){}otPeekPixels=null;otPeekExact=false;otPeekSchedule('Pixel stream stalled')}}else if(!otPeekRetry&&!ws)otPeekSchedule('Pixel stream unavailable')},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.connected&&!otPeekManualStop){if(otPeekSocket?.readyState!==1&&!otPeekRetry)otPeekSchedule('Resuming live preview');otPeekPaint()}});
if(location.pathname.toLowerCase().endsWith('/opentail.htm')){connectWled()}

</script></body></html>
