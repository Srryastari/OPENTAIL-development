// Universal Zone Registry v1: immutable identity, mutable label/range/controller mapping.
function otNewZoneId(){

   do {id=otNewZoneId()}while(used.has(id));

   for(const oldId of Object.keys(p.sectionAnimations)){

}

function displayPixels(zone,limit=90){if(!zone)return `<p class="muted">No section selected</p>`;let n=Math.min(zone.length,limit);let colors=state.selectedPixels[zone.id]||{};let a=Math.max(0,Math.min(state.selectionStart||0,zone.length-1)),b=Math.min(zone.length,a+(state.selectionCount||1));return `<div class="side-name">${esc(zone.name)} · ${zone.length} pixels · ${zone.start}–${zone.start+zone.length-1}</div><div class="pixels">${Array.from({length:n},(_,i)=>`<button class="pixel ${state.selectedZone===zone.id&&state.selectedPixel===i?'selected':''} ${state.selectedZone===zone.id&&i>=a&&i<b?'in-range':''}" data-pixel-index="${i}" data-zone-id="${esc(zone.id)}" aria-label="Pixel ${i+1}" aria-pressed="${state.selectedZone===zone.id&&i>=a&&i<b}" title="Pixel ${i+1} ${i>=a&&i<b?'selected':''}" style="background:${esc(colors[i]||zoneColors(zone.id))}" onclick="choosePixel('${zone.id}',${i})"></button>`).join('')}${zone.length>n?`<span class="small muted">Showing ${n} of ${zone.length} pixels</span>`:''}</div>`}

function otLedCountPanel(){const required=otLayoutPixels(),configured=Number(state.wledInfo?.leds?.count||0),ready=state.connected&&configured>=required;return `<div class="card"><h3>LED count · calculated automatically</h3><div class="statbar"><div class="stat"><strong>${required}</strong><span>Required by sections</span></div><div class="stat"><strong>${otControllerMode==='core'?(otCoreStatus?.leds_per_chain!=null?(Number(otCoreStatus.leds_per_chain)*2):'—'):(state.connected?configured:'—')}</strong><span>Configured on WLED</span></div></div><p class="small muted">Change a section length or add a section; OpenTail recalculates the required pixel count and all following start indices. You do not type a separate total in OpenTail.</p>${state.connected&&configured<required?`<div class="notice" role="alert">Your arrangement needs ${required} pixels, but WLED is currently configured for ${configured}. The physical strip does not report its length. Set the physical LED count in WLED LED Preferences first; the app will then sync section ranges. Existing partial bench testing remains available.</div>`:state.connected?`<p class="small muted">${ready?'WLED count covers this layout. You can sync the section ranges.':''}</p>`:''}</div>`}

function triggerEditor(){const names=['Park','Brake','Left Turn','Right Turn','Hazards','Reverse','Startup','Shutdown','Lock','Unlock'];const n=state.triggerEditing&&state.profiles[state.triggerEditing]?state.triggerEditing:'Brake';const p=state.profiles[n];const opts=state.layout.map(z=>`<label style="display:inline-flex;gap:5px;align-items:center;margin:5px"><input type="checkbox" ${p.zones.includes(z.id)?'checked':''} onchange="triggerZone('${n}','${z.id}',this.checked)">${esc(z.name)}</label>`).join('');return `<div class="card"><h2>Trigger animation editor</h2><p class="small muted">Select a trigger, customize it here, then run it on the physical WLED segments. Bench simulation only; no vehicle 12V inputs yet.</p><div class="trigger-grid">${names.map(t=>`<button type="button" aria-pressed="${!!state.benchSignals[t]}" class="trigger-tile ${state.benchSignals[t]?'is-on':''} ${n===t?'is-editing':''}" onclick="toggleTrigger('${t}')"><span class="trigger-name">${esc(t)}</span><span class="trigger-icon">${state.benchSignals[t]?'✓':'○'}</span><small>${state.benchSignals[t]?'ACTIVE':'OFF'}</small></button>`).join('')}</div><div class="notice">Tap a tile to activate or deactivate its trigger. Use Edit to select a trigger without activating it.</div><div class="trigger-edit-row"><label class="field">Editing trigger<select onchange="chooseTrigger(this.value)">${names.map(t=>`<option value="${t}" ${t===n?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="btnrow">${button('■ Stop All (OFF)','stopTrigger()')}${button('Restore Previous Lighting','otRestorePreviousLighting()')}${button('Save settings','saveStatus()')}</div><div class="notice">${esc(state.triggerStatus||'Trigger ready')}</div>${dropdown('Animation pattern',p.pattern,['solid','wipe','chase','fade','strobe','pulse','blink'],'triggerEdit("pattern",this.value)')}${field('Foreground / Fx',p.color,'color','',`oninput="triggerEdit(&#39;color&#39;,this.value)"`)}${field('Background / Bg',p.secon const otCoreOriginIsLocal = /^\/(?:studio\/?|studio\.htm)$/i.test(location.pathname);
function otCoreStoredValue(key,defaultValue){try{return localStorage.getItem(key)||defaultValue}catch{return defaultValue}}
function otCoreStoreValue(key,value){try{localStorage.setItem(key,value)}catch(e){console.warn('CORE setting not stored',e)}}

function otCoreNormalizeUrl(){
  let val=String(otCoreAddress||'').trim();
  if(!/^https?:\/\//i.test(val))val='http://'+val;
  let u;try{u=new URL(val)}catch{throw Error('Enter a controller IP address, e.g. http://192.168.4.1')}
  if(!['http:','https:'].includes(u.protocol)||!u.hostname||u.username||u.password||u.pathname!=='/'||u.search||u.hash)throw Error('Use only a plain HTTP(S) controller address');
  if(location.protocol==='https:'&&u.protocol==='http:')throw Error('HTTP CORE cannot be reached from a secure HTTPS page. Open Studio from http://192.168.4.1/studio instead.');
  return u.origin;
}
async function otCoreRequest(path,body,timeout=3500){
  const url=otCoreNormalizeUrl()+path;
  const opts={method:body===undefined?'GET':'POST',cache:'no-store',signal:AbortSignal.timeout(timeout)};
  if(body!==undefined){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(body)}
  const r=await fetch(url,opts);
  if(!r.ok)throw Error('CORE HTTP '+r.status);
  const data=await r.json();
  if(!data||typeof data!=='object'||data.error||data.ok===false)throw Error(String(data?.error||'CORE returned an invalid response'));
  return data;
}
function otCoreValidateCapabilities(data){
  if(data.protocol!=='opentail-core-alpha-v1')throw Error('This device is not an OpenTail CORE Alpha v1 controller');
  if(data.bench_only!==true||data.studio_wled_api_compatible!==false)throw Error('Unknown CORE capabilities. No commands sent.');
  return data;
}
function otCoreSelectMode(next){

    otShowToast('Stop and restore the active WLED bench session before switching controllers.',true);return;
  }
  if(next==='core'){
    if(state.connected)disconnectWled();
    if(state.connected)return;
  }else if(next==='wled'){
    otCoreConnected=false;otCoreStatus=null;otCoreCaps=null;
  }
  otControllerMode=next;

}

async function otCoreConnect(){

    const status=await otCoreRequest('/api/v1/status');
    if(status.bench_only!==true||typeof status.frames!=='number')throw Error('CORE status failed validation');

    otCoreMessage='Connected: '+String(status.name||'OpenTail CORE')+' · '+String(status.version||'?')+' (bench only)';
  }catch(e){otCoreConnected=false;otCoreMessage='Connection failed: '+e.message+'. Connect to OpenTail-CORE-Alpha Wi-Fi, then open http://192.168.4.1/studio.';}

async function otCorePoll(){
 if(otControllerMode!=='core'||!otCoreConnected||otCorePending||otCorePollPending||otCoreCommandPending||document.hidden)return;
 otCorePollPending=true;const stamp=otCoreStatusEpoch;
 try{const current=await otCoreRequest('/api/v1/status',undefined,2600);
   if(stamp!==otCoreStatusEpoch||otCoreCommandPending)return;
   if(current.bench_only!==true)throw Error('Invalid CORE status');otCoreStatus=current;otCoreFaults=0;otCorePaint()}
 catch(e){if(stamp!==otCoreStatusEpoch)return;otCoreFaults++;otCoreMessage='CORE status read failed: '+e.message;
   if(otCoreFaults>=3){otCoreConnected=false;otCoreMessage+=' · Disconnected; reconnect when reachable.';render()}
   else otCorePaint();
 }finally{otCorePollPending=false}
}
function otCoreQueueCommand(path,body,label){
 if(!otCoreConnected){otCoreMessage='Connect to CORE first.';otCorePaint();return Promise.resolve(false)}
 otCoreCommandPending++;otCoreStatusEpoch++;

   if(!otCoreConnected)throw Error('CORE disconnected');
   await otCoreRequest(path,body,5000);

   otCoreStatus=d;otCoreMessage=label+' · controller acknowledged · '+new Date().toLocaleTimeString();otCorePaint();
   return true;
 };

 otCoreCommandChain=job.catch(()=>{});

function otStudioRoute(tab){
 if(otControllerMode==='core')return ({
  home:otCoreHome,
  device:otCoreDevice,
  scenes:()=>otCoreWorkspaceBanner('Show Modes')+scenes(),
  builder:()=>otCoreWorkspaceBanner('Triggers')+builder(),
  layout:()=>otCoreWorkspaceBanner('Layout')+layout(),
  diagnostics:otCoreDiagnostics
 })[tab]();
 return ({home,scenes,builder,layout,device,diagnostics})[tab]();
}

function device(){return otCoreControllerPicker()+`<div class="card"><div class="line"><h2>Live Connection Status</h2><span class="status-pill ${state.connected?'is-connected':'is-disconnected'}"><i class="status-dot"></i>${state.connected?'Connected':'Disconnected'}</span></div><div class="statbar"><div class="stat"><strong>${state.wledInfo?.leds?.count??'—'}</strong><span>Controller LEDs</span></div><div class="stat"><strong>${state.wledEffects.length}</strong><span>WLED effects</span></div></div><p class="small muted">${esc(state.status)}</p></div>${otRecoveryBanner()}<div class="card"><h2>Controller Connection</h2>${field('WLED address',state.url,'text','placeholder="http://4.3.2.1"',`oninput="set('url',this.value,false)"`)}<div class="btnrow">${button('Connect','connectWled()','primary')}${button('Disconnect','disconnectWled()')}${button('Full WLED controls ↗','otOpenWledUi()')}</div></div>${otColorTestPanel()}<div class="card"><h2>Project Backup</h2><div class="btnrow">${button('Export project','exportProject()','primary')}<label class="btn">Import project<input type="file" accept="application/json" style="display:none" onchange="importProject(this.files[0])"></label></div></div>`}
function otAbout(){alert('OpenTail Studio v'+OT_VERSION+'\nCORE Alpha integration with original Studio Show Modes, Triggers, Layout and Universal Effect Editor visible for local editing. CORE firmware supports live temporary bench tests only; Studio changes are not applied to CORE yet. Shared WLED effect editor, robust Stop & Restore with readback, live shuffled titles, optional shared sequence palette, controller-authentic palette previews and inline Fx/Bg/Cs slots. Previous:  custom software triggers, one-tap assignments, 1D effect filtering, presets, simplified events, obsolete Originals player removed (legacy restoration retained); effect-specific Foreground, Background and Accent controls; batched color readback; compact trigger cards, session-only animation clipboard, selective multi-section paste and Undo. Hardware ACC triggering and CORE animation firmware remain future work.');}
const OT_NAV_ICONS={
 home:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 device:'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/>',
 scenes:'<path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7zM19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',
 builder:'<path d="M8 3v18M16 3v18M3 8h18M3 16h18"/><circle cx="8" cy="8" r="2"/><circle cx="16" cy="16" r="2"/>',
 layout:'<rect x="2" y="3" width="20" height="18" rx="3"/><path d="M2 10h20M10 10v11"/>',
 diagnostics:'<path d="M2 13h4l3-7 4 12 3-6h6"/>'
};
function otNavIcon(id){return '<svg class="ot-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(OT_NAV_ICONS[id]||OT_NAV_ICONS.home)+'</svg>'}
const OT_PAGE_SUBS={home:'Your vehicle lighting, at a glance.',device:'Controllers, connections and safe bench testing.',scenes:'Create lighting effects, sequences and presets.',builder:'Configure lighting behaviors and vehicle events.',layout:'Organize sections and pixel output mapping.',diagnostics:'Health, logs and controller capabilities.'};
function otPageIntro(){const tab=TABS.find(item=>item[0]===state.tab)||TABS[0];return `<section class="ot-page-intro"><div><div class="ot-eyebrow">${otControllerMode==='core'?'CORE WORKSPACE':'WLED WORKSPACE'} <span aria-hidden="true">/</span> ${esc(state.projectName||'Untitled project')}</div><h1>${esc(tab[2])}</h1><p>${OT_PAGE_SUBS[tab[0]]||''}</p></div><div class="ot-mode-tag">${otControllerMode==='core'?'CORE Alpha':'WLED'}</div></section>`;}
function render(){document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="logo"><div class="mark" aria-hidden="true"><svg viewBox="0 0 28 28" width="23" height="23" fill="none"><path d="M14 2 17.6 10.4 26 14l-8.4 3.6L14 26l-3.6-8.4L2 14l8.4-3.6L14 2Z" fill="currentColor"/></svg></div><div><div class="brand">OpenTail <span>Studio</span></div><div class="sub">Automotive lighting studio</div></div></div><span id="ot-save-failure" class="ot-save-failure" role="alert" ${otSaveState==='failed'?'':'hidden'}>⚠ Save failed</span><span class="status-pill ${(otControllerMode==='core'?otCoreConnected:state.connected)?'is-connected':'is-disconnected'}"><i class="status-dot"></i>${(otControllerMode==='core'?otCoreConnected:state.connected)?'Online':'Offline'}</span></header><nav class="tabs">${TABS.map(([id,ic,t])=>`<button class="tab ${state.tab===id?'active':''}" ${state.tab===id?'aria-current="page"':''} onclick="go('${id}')">${otNavIcon(id)}<span>${t}</span></button>`).join('')}</nav>${otControllerMode==='wled'?otSequenceGlobalControl():''}<main>${otPageIntro()}${otStudioRoute(state.tab)}</main><footer class="footer"><span>OpenTail Studio · Bench / design</span><button onclick="otAbout()" class="ot-version">v${OT_VERSION}</button></footer></div><nav class="bottomnav">${TABS.map(([id,ic,t])=>`<button class="${state.tab===id?'active':''}" ${state.tab===id?'aria-current="page"':''} onclick="go('${id}')">${otNavIcon(id)}<span>${t}</span></button>`).join('')}</nav>${otUEMarkup()}`;otPaintAllRanges();otPeekPaint();if(state.tab==='builder')otPaintTurnPreview()}

otMigrateLegacyDefaultTriggers();
// Existing F1 Brake saved projects retain their settings in a legacy backup; Brake absorbs their section assignments.
if(state.profiles?.['F1 Brake']){const old=state.profiles['F1 Brake'];state.legacyF1Brake ||= structuredClone(old);
 const br=state.profiles.Brake||(state.profiles.Brake=DEFAULT_PROFILE('Brake','automotive','#ff0000'));
 br.zones=[...new Set([...(br.zones||[]),...(old.zones||[])])];delete state.profiles['F1 Brake'];}
document.addEventListener('pointerdown',()=>{otHasUserInteracted=true},{capture:true});
document.addEventListener('keydown',()=>{otHasUserInteracted=true},{capture:true});
document.addEventListener('input',ev=>{if(ev.target?.matches?.('input[type=range]'))otRangeInput(ev.target)},{capture:true});
render();
setInterval(()=>{if(otControllerMode==='core'&&otCoreConnected)void otCorePoll()},1800);
if(otCoreOriginIsLocal){state.tab='device';render();Promise.resolve().then(()=>otCoreConnect()).catch(e=>{otCoreMessage='Auto-connect failed: '+e.message;otCorePaint()})}
setInterval(()=>{if(state.tab==='home'||state.tab==='scenes')otPeekPaint();if(otControllerMode!=='wled'||!state.connected||otPeekManualStop||document.hidden)return;const ws=otPeekSocket;if(ws&&ws.readyState===1){const since=Date.now()-(otPeekAt||otPeekOpenedAt);if(since>10000){otPeekStatus='Pixel stream stalled';otPeekSocket=null;try{ws.close()}catch(e){}otPeekPixels=null;otPeekExact=false;otPeekSchedule('Pixel stream stalled')}}else if(!otPeekRetry&&!ws)otPeekSchedule('Pixel stream unavailable')},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&otControllerMode==='wled'&&state.connected&&!otPeekManualStop){if(otPeekSocket?.readyState!==1&&!otPeekRetry)otPeekSchedule('Resuming live preview');otPeekPaint()}});
if(otControllerMode==='wled'&&/^\/opentail(?:-v[0-9.]+)?\.html?$/i.test(location.pathname)){connectWled()}

</script></body></html>
